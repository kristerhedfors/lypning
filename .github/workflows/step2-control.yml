name: Step 2 paid Cerebras control (no GPU)

on:
  workflow_dispatch:
    inputs:
      rung:
        description: Bounded control rung
        required: true
        type: choice
        options: [smoke, targets, budget20, confirmatory, full]
        default: smoke
      ceiling_usd:
        description: Hard Cerebras dollar ceiling (smoke <= 5, targets <= 6, budget20 <= 20, confirmatory <= 50, full <= 14 per shard)
        required: true
        type: string
        default: '5'
      # The `full` rung only. The target set for S4 arm A needs verified
      # draws on at least 1,000 of the 1,355 train cases, and the 192 the
      # `targets` rung bought (run 35767396604) are the first 192 of the full
      # order, so the full rung skips them and splits the other 1,163 into
      # interleaved shards, each generated and graded on its own:
      #   2 shards: 582/581 cases, 4,656/4,648 requests, ~$11.00 each, ~106 min
      #   3 shards: ~388 cases,  ~3,104 requests,        ~$7.34 each,  ~71 min
      # priced at the measured $3.63061517 per 1,536 requests (run 35767396604,
      # 2026-09-22) and 43.8 rpm; the remaining 1,163 cases cost about $22.0
      # in both arms at k=4 however they are sharded. A single shard is
      # refused: its 9,304 completions would need ~387 min to grade, past the
      # grade job's 360-minute cap. Dispatch the shards ONE AT A TIME -- the
      # concurrency group keeps a single pending run, and a newer dispatch
      # replaces the pending one -- and freeze the Rust engine from the first
      # shard until the last arm-A seed: every target row is bound to its hash,
      # and `step2_merge.py` refuses shards graded by different engines.
      shard_index:
        description: "full only: which shard, 0-based"
        type: choice
        options: ['0', '1', '2', '3']
        default: '0'
      shard_count:
        description: "full only: how many shards the remainder is split into"
        type: choice
        options: ['2', '3', '4']
        default: '2'
      skip_prefix:
        description: "full only: leading cases already generated (192 = run 35767396604)"
        type: choice
        options: ['192', '0']
        default: '192'

permissions:
  contents: read
  actions: read

concurrency:
  group: step2-paid-control
  cancel-in-progress: false

env:
  PYTHONPATH: src:training
  LYPNING_CAPTURE: '0'
  LYPNING_HARVEST: '0'
  STEP2_RUNG: ${{ inputs.rung }}
  STEP2_CASES: ${{ inputs.rung == 'smoke' && '64' || (inputs.rung == 'targets' || inputs.rung == 'budget20') && '192' || inputs.rung == 'full' && '1355' || '300' }}
  STEP2_SAMPLES: ${{ (inputs.rung == 'smoke' || inputs.rung == 'targets' || inputs.rung == 'full') && '4' || '16' }}
  # Every other rung is one unsharded run, whatever the shard inputs say.
  STEP2_SHARD_INDEX: ${{ inputs.rung == 'full' && inputs.shard_index || '0' }}
  STEP2_SHARD_COUNT: ${{ inputs.rung == 'full' && inputs.shard_count || '1' }}
  STEP2_SKIP_PREFIX: ${{ inputs.rung == 'full' && inputs.skip_prefix || '0' }}
  STEP2_CEILING_USD: ${{ inputs.ceiling_usd }}
  STEP2_MAX_SECONDS: ${{ inputs.rung == 'smoke' && '3600' || '14400' }}
  # The first 192-case target expansion (35763603648) stopped on one opaque
  # provider error after 327 calls at 60 rpm. Only the 512-call smoke has
  # completed at 60 rpm; every longer rung, including the k=16 rungs that
  # decide Step 2, gets 25% sliding-window headroom at 45 rpm and keeps zero
  # retries. The confirmatory rung (9,600 calls) needs about 213 minutes of its
  # 240-minute dispatch window at this rate.
  STEP2_RPM: ${{ inputs.rung == 'smoke' && '60' || '45' }}
  STEP2_RUN_ID: ${{ inputs.rung }}${{ inputs.rung == 'full' && format('-{0}of{1}', inputs.shard_index, inputs.shard_count) || '' }}-${{ github.sha }}-${{ github.run_id }}

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit spend ceiling
        run: |
          python - <<'PY'
          import math, os
          ceiling = float(os.environ['STEP2_CEILING_USD'])
          limit = {'smoke': 5, 'targets': 6, 'budget20': 20,
                   'confirmatory': 50, 'full': 14}[os.environ['STEP2_RUNG']]
          if not math.isfinite(ceiling) or not 0 < ceiling <= limit:
              raise SystemExit('ceiling must be positive and <= $%d for this rung' % limit)
          PY
      # Free, before any build or call: a full shard whose ceiling, generation
      # window or grading time cannot cover it would stop half-way, and a
      # partial run is never graded. Prints the projection; counts only.
      - name: Size this shard against its ceiling and windows
        run: python .github/scripts/step2_shard.py
      - run: pip install -q 'huggingface-hub==1.31.0' 'transformers==5.17.0' jinja2
      - name: Check account-visible provider model without generation
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python -m harvesting.preflight
      - name: Pin private bank and tokenizer; print aggregate cost plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/step2_bank_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: step2-control-public-plan
          path: ${{ runner.temp }}/step2-plan.json
          if-no-files-found: error
      - name: Build the native candidate for CPython 3.12
        run: |
          echo "LYPNING_HOME=$RUNNER_TEMP/step2-engine" >> "$GITHUB_ENV"
          LYPNING_HOME="$RUNNER_TEMP/step2-engine" python -m lypning build --rust --target host
      - name: Build minimal candidate on the pinned training base
        run: |
          BASE=$(python -c 'import runpy; print(runpy.run_path("training/hf/launch.py")["BASE_IMAGE"])')
          echo "CHECK_BASE_IMAGE=$BASE" >> "$GITHUB_ENV"
          CONTEXT=$(mktemp -d)
          cp training/pipeline/{sandbox,child_exec,container_worker}.py "$CONTEXT/"
          cp "$LYPNING_HOME/bin/lypning-l" "$CONTEXT/"
          docker build --build-arg BASE_IMAGE="$BASE" -f training/worker/Dockerfile.verifier -t step2-candidate "$CONTEXT"
          echo "CANDIDATE_IMAGE=$(docker image inspect step2-candidate --format '{{.Id}}')" >> "$GITHUB_ENV"
          cat > "$CONTEXT/Dockerfile.check" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends git && rm -rf /var/lib/apt/lists/*
          EOF
          docker build --build-arg BASE_IMAGE="$BASE" -f "$CONTEXT/Dockerfile.check" -t step2-check "$CONTEXT"
      - name: Full large-engine corpus in the actual pinned Python runtime
        run: |
          mkdir -p "$RUNNER_TEMP/step2-source" "$RUNNER_TEMP/step2-result"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/step2-source"
          docker run --rm --network none \
            -v "$RUNNER_TEMP/step2-source:/work" \
            -v "$LYPNING_HOME:/engine:ro" \
            -v "$RUNNER_TEMP/step2-result:/result" \
            -w /work -e PYTHONPATH=src:training -e LYPNING_HOME=/engine \
            -e LYPNING_CAPTURE=0 -e LYPNING_HARVEST=0 \
            -e CHECK_BASE_IMAGE="$CHECK_BASE_IMAGE" step2-check sh -eu -c '
              git config --global --add safe.directory /work
              git init -q
              git config user.email validation@localhost
              git config user.name validation
              git add .
              git commit -qm snapshot
              python .github/scripts/step2_candidate_check.py'
      - name: Verify selected references without credentials or network
        run: python .github/scripts/step2_reference_check.py
      - name: Generate bounded paired Cerebras control
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python .github/scripts/step2_generate.py
      - name: Persist raw evidence in private dataset repository
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/step2_private_upload.py
