# CI runs the deterministic half of this project and nothing else.
#
# `lypning bench` is deliberately absent. A wall-clock benchmark on a shared
# runner measures the runner: the arms are 1-2 ms apart and a noisy neighbour
# moves them further than a real regression would. `bench` knows it is in CI and
# prints a banner saying so; the place a timing becomes a fact is
# docs/BENCH-LEDGER.md, with the machine and the date attached. What CI can
# decide is correctness — does an engine ever disagree with CPython, does the
# refusal contract still hold on the binary that was just built, does the wheel
# a `pip` user gets actually work — and that is what is below.
#
# One job here is `continue-on-error` and it is not decoration; it says at its
# own head what makes it blocking. Exactly one, because a non-blocking job is a
# claim about WHY its red is tolerable, and a job whose red had two possible
# meanings could not make that claim: the MicroPython work used to be one job
# that reddened for a wrong answer and for an unreachable download alike, so
# for four runs it reported an outage in the vocabulary of a defect and nobody
# noticed the battery under it had stopped running. It is two jobs now — can
# the tier be built, and does the tier agree — and only the second is excused.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The capture harness exists to record what an agent typed. A runner types
  # nothing, so both feeds are off: anything they wrote here would be noise
  # entering the corpus through the back door.
  LYPNING_CAPTURE: "0"
  LYPNING_HARVEST: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # --- the floor, enforced by running it ------------------------------------
  #
  # requires-python is ">=3.9" and pyproject claims a classifier for every
  # minor through 3.13. A claim nothing executes is a comment, so every one of
  # them runs the suite. No cargo here on purpose: without an engine built,
  # conftest skips the ~100 tests that spawn one and the remaining ~470 are the
  # pure-Python half — which is exactly the half a syntax-level 3.9 regression
  # (a `match`, a runtime `X | Y`, a missing `from __future__ import
  # annotations`) breaks. The `core` job below runs the other half once.
  tests:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (dev extra — pytest is dev-only; the package itself has no deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: the package imports with zero third-party runtime dependencies
        # `pip check` on a tree whose only extra is pytest proves the runtime
        # dependency list is still empty, which is invariant 6 and the one thing
        # a reviewer cannot see by reading a diff of pyproject.toml alone.
        run: |
          pip check
          python -c "import lypning, sys; print(lypning.__version__, 'on', sys.version.split()[0])"
      - name: pytest
        run: python -m pytest tests -q
      - name: the CLI answers on this interpreter
        # An unbuilt tree must route to CPython and say why, never crash: this is
        # the state every `pip install lypning` starts in.
        run: |
          lypning --version
          lypning status
          lypning route -c 'print(2**8)'
          test "$(lypning run -c 'print(2**8)')" = 256

  # --- the core: build it, then prove the contract on what was built --------
  core:
    name: rust core — contract, gate, conformance
    runs-on: ubuntu-latest
    # The corpus grows every session and the battery grows with it: 21 min at
    # 2,906 entries (2026-09-01), timed out at 25 with 3,688 (2026-09-02). A
    # timed-out job is reported "cancelled", which reads as somebody's hand
    # rather than a budget — so the budget is stated here, with its history.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: strace, so the file-open check is measured rather than skipped
        # `lypning gate` treats an unmeasurable check as not-passing and labels
        # it `unmeasured`; without strace the 0-file-opens property — the whole
        # reason the binary is static musl — is never actually tested. An apt
        # outage must not redden the job, so this step tolerates its own failure
        # and says what is lost.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace \
            || echo "no strace: gate will report file opens as unmeasured, which is not a pass"
      - name: build the core
        # build.py refuses to report `ok` until the refusal contract holds on
        # the binary it just produced — the assertion is inside this line, not
        # after it. The steps below re-assert it from outside anyway, because a
        # build that reported ok and a binary that behaves are two claims.
        run: lypning build --rust
      - name: the exit-90 contract, asserted on the binary
        # exit 90, exactly one `<engine>: unsupported: <kind>: <detail>` line on
        # stderr, nothing at all on stdout. This is the one property of lypning
        # that has only ever broken silently: a parser change that turns a
        # refusal into a traceback still compiles, still links, still passes
        # --version. A dispatcher that saw a traceback instead of 90 would
        # report the engine's error as the program's.
        run: |
          # stderr lands in $RUNNER_TEMP, not the workspace: the last step of
          # this job fails on an untracked file, and it is meant to be reporting
          # the corpus, not this step's scratch.
          e="$RUNNER_TEMP/refusal.err"
          set +e
          out=$(lypning -c 'import subprocess' 2>"$e"); rc=$?
          set -e
          err=$(cat "$e")
          test "$rc" = 90        || { echo "exit $rc, want 90"; exit 1; }
          test -z "$out"         || { echo "stdout was not empty: $out"; exit 1; }
          test "$(wc -l <"$e")" = 1 || { echo "stderr was not one line:"; cat "$e"; exit 1; }
          case "$err" in "lypning: unsupported: "*) ;; *) echo "bad contract line: $err"; exit 1 ;; esac
          echo "refusal: exit 90, one line on stderr, clean stdout — $err"
      - name: the commit barrier — a refusal after a print still writes nothing
        # The half of the contract that makes falling onward safe. If the tier
        # had already committed those bytes, CPython's rerun would append to
        # them and the caller would see the prefix twice. docs/LYPNING.md §6.
        run: |
          set +e
          out=$(lypning -c 'print("committed"); import subprocess' 2>/dev/null); rc=$?
          set -e
          test "$rc" = 90 || { echo "exit $rc, want 90"; exit 1; }
          test -z "$out"  || { echo "the tier committed stdout before refusing: $out"; exit 1; }
          echo "commit barrier: refused after a print, stdout still empty"
      - name: doctor
        # Non-zero on any FAIL. Reports WARN for the hooks, the shim and the
        # absent MicroPython tier, which is the correct state for a runner.
        run: lypning doctor
      - name: gate the core
        # static, zero shared objects, zero file opens, and the byte count that
        # the cold cost is a step function of.
        run: lypning gate
      - name: pytest, now with an engine to spawn
        # The ~100 cases the matrix job skips: everything that runs a program
        # through a tier and compares the answer.
        run: python -m pytest tests -q
      - name: conformance — the arms that are clean
        # Named arms, not a bare `lypning conformance`, and the difference
        # matters. A bare run on this runner is clean too, but only because the
        # MicroPython tier is not built here — CI whose meaning depends on what
        # happens to be installed is CI that will one day go quiet.
        #
        # READ THAT SENTENCE AGAIN, because it is true of the `mixture` arm on
        # this line and was not known to be when it was written. `mixture` is
        # clean HERE only while lypning-mp is absent: the classifier then routes
        # to CPython what it would otherwise hand to the tier. Measured
        # 2026-08-23 with the tier built, this same arm mismatches — see the
        # `_not_accepted` note in .github/known-mismatches.json. So the arm that
        # grades what the caller actually gets is graded, for that program, on
        # the one configuration where the caller cannot be hurt by it.
        #
        # `lypning` is clean by selection and unconditionally. The third arm,
        # lypning-mp, is known red — see the micropython-conformance job.
        run: lypning conformance --engine lypning --engine mixture
      # --- the same contract, through the ABI instead of through a process ---
      #
      # The library shares the interpreter with the binary above and does NOT
      # share the exit path, and the exit path is the half that has only ever
      # broken silently. So it is built here and held to every property the
      # binary is held to, in its own terms.
      - name: build the C ABI
        # `build --lib` refuses to report ok until the refusal contract holds
        # through the ABI on the library it just produced. Same assertion,
        # same reason, one indirection further out.
        run: lypning build --lib
      - name: the exit-90 contract, asserted through the ABI
        # A shared object has no exit code and no stderr of its own, so each of
        # the three pinned properties is re-asserted as a value — plus a fourth
        # that only embedding needs: the refusal must ASK to be routed onward,
        # because in-process it is the host that owns the retry, and a refusal
        # nobody acts on is a program that never ran.
        run: |
          python - <<'EOF'
          from lypning import embed
          lib = embed.Library()
          out = lib.run("import subprocess")
          assert out.status == embed.UNSUPPORTED, out.status_name
          assert out.exit_code == 90, out.exit_code
          assert out.stdout == b"", out.stdout[:120]
          assert out.stderr == embed.REFUSAL_LINE, out.stderr[:160]
          assert out.fall_onward and not out.committed
          print("library refusal: unsupported, exit 90, clean stdout, one line, routes onward")
          EOF
      - name: a host compiles against what `lypning lib` printed
        # The flags are the product: they get substituted into somebody's
        # compiler line, so printing them is not the same claim as their
        # working. This is the shipped C example, built the way its README
        # says, against the INSTALLED library rather than the build tree.
        run: |
          gcc $(lypning lib --cflags) src/lypning/assets/examples/c/embed.c \
              -o "$RUNNER_TEMP/embed" $(lypning lib --libs)
          cd "$RUNNER_TEMP" && ./embed
      - name: conformance — the library arm, scored like a spawned one
        # The whole corpus through the C ABI in this process, against CPython,
        # by the rules the spawned arms are scored by. It must reach MISMATCH 0
        # AND agree with the `lypning` arm program for program: the two
        # disagreeing is the drift this arm exists to catch.
        run: lypning conformance --engine lypning --engine library
      # --- every host over the ABI, each held to the one quickstart contract --
      #
      # docs/EMBEDDING.md section 4 is the table of hosts; the steps below are
      # that table, executed, for every host a Linux runner can build. Each
      # gates on its own toolchain rather than on the runner image: a tool that
      # is not there is not a red host, it is a host that says so and exits 0,
      # because the image changes under us and a missing compiler is not a
      # wrong answer. What is asserted is the same five probes for every
      # quickstart: an answer in-process, a refusal answered ONCE by CPython,
      # argv passed through, a traceback that is exit 1 and NOT retried, and
      # sys.exit carried unchanged. They are written once, as a shell function,
      # so no host can pass by having skipped one. ZeroDivisionError is COUNTED
      # rather than grepped for: a host that fell onward after a traceback
      # would print it twice, and that is the retry the contract forbids.
      - name: the quickstart contract, as one function every host is run through
        run: |
          cat >"$RUNNER_TEMP/probes.sh" <<'EOF'
          probes() {
            # $@ is the host's quickstart command; each line below is one probe.
            test "$("$@" 'print(sum(range(10)))')" = 45
            test "$("$@" 'import subprocess; print(1)')" = 1
            test "$("$@" 'import sys; print(sys.argv[1:])' a b)" = "['a', 'b']"
            rc=0; "$@" 'print(1/0)' >/dev/null 2>"$RUNNER_TEMP/probe.err" || rc=$?
            test "$rc" -eq 1
            test "$(grep -c ZeroDivisionError "$RUNNER_TEMP/probe.err")" -eq 1
            rc=0; "$@" 'import sys; sys.exit(3)' >/dev/null || rc=$?
            test "$rc" -eq 3
            echo "$1: 45 in-process; refusal answered once by CPython; argv; traceback exit 1, not retried; exit 3"
          }
          EOF
      - name: C — the contract example, then the file a host author copies
        # The Makefile picks the checkout's freshly built library and fails
        # naming `lypning build --lib` if it is absent. The fallback branch is
        # execvp("python3"), so the runner's python3 is the second tier.
        run: |
          command -v cc >/dev/null || { echo "no C compiler: C host not built"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          make -C src/lypning/assets/examples/c run
          make -C src/lypning/assets/examples/c quickstart
          probes src/lypning/assets/examples/c/quickstart
      - name: C++ — header-only RAII over the same ABI
        run: |
          command -v c++ >/dev/null || { echo "no c++: C++ host not built"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          make -C src/lypning/assets/examples/cpp run
          make -C src/lypning/assets/examples/cpp quickstart
          probes src/lypning/assets/examples/cpp/quickstart
      - name: Rust — the crate by path, no ABI in between
        # Nothing to link: this host compiles ../../rust from source, so it is
        # the one host `build --lib` does nothing for. `cargo run` passes the
        # example's exit status through, which the sys.exit probe relies on.
        run: |
          command -v cargo >/dev/null || { echo "no cargo: Rust host not built"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          M=src/lypning/assets/examples/rust/Cargo.toml
          cargo run --release --manifest-path "$M"
          probes cargo run -q --release --manifest-path "$M" --example quickstart --
      - name: Node — a plain cargo build links the addon, node loads it
        # No npm dependencies, no node-gyp: cargo and node are all it needs.
        # Loading the addon is the assertion build.rs exists for: the Node-API
        # symbols resolve from the node process at dlopen, or not at all.
        run: |
          { command -v cargo && command -v node; } >/dev/null || { echo "no cargo or no node: Node host not built"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          cd src/lypning/assets/node
          cargo build --release
          probes node quickstart.js
          npm test
      - name: Python — ctypes over the library, stdlib only
        # No compiler in the loop: the only thing this host needs is the
        # library `build --lib` produced above, which is why it has no gate.
        run: |
          . "$RUNNER_TEMP/probes.sh"
          probes python src/lypning/assets/examples/python/quickstart.py
      - uses: actions/setup-go@v5
        id: go
        # A setup failure (a download outage, a retired version string) is a
        # missing toolchain, and the step below treats it as one: skipped and
        # said so, not red. The same rule as every other host's gate.
        continue-on-error: true
        with:
          go-version: stable
          cache: false   # no go.sum to key on: the module has zero dependencies
      - name: Go — cgo over the unchanged header
        # Built, then run: `go run` reports every non-zero exit as 1 with an
        # "exit status N" line of its own, so the sys.exit probe cannot pass
        # through it. CGO_LDFLAGS is what `lypning lib --libs` printed, the
        # flags a Go module outside the checkout would use, so this links the
        # INSTALLED library and not only the one the #cgo directives find.
        if: steps.go.outcome == 'success'
        env:
          CGO_ENABLED: "1"
        run: |
          command -v go >/dev/null || { echo "no go: Go host not built"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          export CGO_LDFLAGS="$(lypning lib --libs)"
          cd src/lypning/assets/go
          go vet ./...
          go test ./...
          go build -o "$RUNNER_TEMP/go-quickstart" ./quickstart
          probes "$RUNNER_TEMP/go-quickstart"
      - name: LuaJIT — the ffi over the header, read at load, no build step
        # PUC Lua has no ffi, so it is luajit or nothing. An apt outage is a
        # missing toolchain and not a red host, hence the tolerated install.
        run: |
          sudo apt-get install -y -qq luajit >/dev/null 2>&1 || echo "apt could not install luajit"
          command -v luajit >/dev/null || { echo "no luajit: Lua host not run"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          cd src/lypning/assets/lua
          luajit test.lua
          probes luajit quickstart.lua
      - name: the corpus rewrites repositories; check the net held
        # conformance runs every entry in its own temp cwd and brackets the
        # battery with a git snapshot, but that is a net and not a sandbox: it
        # cannot undo a write outside the repository, only make the next one
        # loud. The first measurement runs upstream rewrote 34 tracked files.
        run: |
          dirty=$(git status --porcelain)
          test -z "$dirty" || { echo "$dirty"; echo "the battery changed tracked files"; exit 1; }

  # --- the library tier on the other operating system the wheel claims -----
  #
  # pyproject.toml carries `Operating System :: MacOS`, and this job is what
  # makes that a fact rather than a classifier. It is not a mirror of `core`:
  # the static-musl core, its gate and its conformance battery are Linux
  # artefacts, and `build --rust` on a Mac builds for the host and says so.
  # What a Mac adds is the host Linux cannot run at all (Swift) and the one
  # link detail Linux never sees: the library's install name must be
  # `@rpath/liblypning.dylib`, or every host linked with `lypning lib --libs`
  # links clean and fails at load. The hosts that need only cc, cargo or node
  # are proven on ubuntu above and not repeated here.
  hosts-macos:
    name: macos — library tier, C, Python and Swift hosts
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: build the core, then the library
        # Both refuse to report ok until the refusal contract holds on what
        # they just produced; `lib` and `status` print what was installed and
        # where, which is the line to read when a host step below fails.
        run: |
          lypning build --rust
          lypning build --lib
          lypning lib
          lypning status
      - name: pytest, on a Mac
        run: python -m pytest tests -q
      - name: the quickstart contract, as one function every host is run through
        # The same function the core job defines, and for the same reason:
        # the five probes are the contract, and a host passes all of them or
        # none. See the comment there.
        run: |
          cat >"$RUNNER_TEMP/probes.sh" <<'EOF'
          probes() {
            # $@ is the host's quickstart command; each line below is one probe.
            test "$("$@" 'print(sum(range(10)))')" = 45
            test "$("$@" 'import subprocess; print(1)')" = 1
            test "$("$@" 'import sys; print(sys.argv[1:])' a b)" = "['a', 'b']"
            rc=0; "$@" 'print(1/0)' >/dev/null 2>"$RUNNER_TEMP/probe.err" || rc=$?
            test "$rc" -eq 1
            test "$(grep -c ZeroDivisionError "$RUNNER_TEMP/probe.err")" -eq 1
            rc=0; "$@" 'import sys; sys.exit(3)' >/dev/null || rc=$?
            test "$rc" -eq 3
            echo "$1: 45 in-process; refusal answered once by CPython; argv; traceback exit 1, not retried; exit 3"
          }
          EOF
      - name: C — compiled against what `lypning lib` printed, run from outside the tree
        # From $RUNNER_TEMP so nothing can resolve back to the checkout: this
        # is a user's host, linked with the flags the CLI hands out. `otool`
        # pins the install name those flags depend on.
        run: |
          gcc $(lypning lib --cflags) src/lypning/assets/examples/c/quickstart.c \
              -o "$RUNNER_TEMP/quickstart" $(lypning lib --libs)
          otool -L "$RUNNER_TEMP/quickstart" | grep -q '@rpath/liblypning.dylib'
          . "$RUNNER_TEMP/probes.sh"
          cd "$RUNNER_TEMP" && probes ./quickstart
      - name: Python — ctypes, which dlopens by absolute path and needs no rpath
        run: |
          . "$RUNNER_TEMP/probes.sh"
          probes python src/lypning/assets/examples/python/quickstart.py
      - name: Swift — the module map over the header, its tests, then the quickstart
        # Package.swift decides the library directory when it is first
        # evaluated and SwiftPM caches the decision, which is why the library
        # is built before this step and the README says to do the same.
        # macos-latest ships a toolchain; a runner without one says so.
        run: |
          command -v swift >/dev/null || { echo "no swift toolchain: Swift host not built"; exit 0; }
          . "$RUNNER_TEMP/probes.sh"
          P=src/lypning/assets/swift
          swift build -c release --package-path "$P" -Xswiftc -warnings-as-errors
          swift test --package-path "$P"
          probes "$P/.build/release/quickstart"
      - name: nothing above wrote into the tree
        # Every build here writes to an ignored path or to $RUNNER_TEMP; an
        # untracked file is a build artefact .gitignore does not know about,
        # which is the same file that would ride into the next wheel.
        run: |
          dirty=$(git status --porcelain)
          test -z "$dirty" || { echo "$dirty"; echo "a host build left files in the tree"; exit 1; }

  # --- can the tier be built at all -----------------------------------------
  #
  # BLOCKING, and it can only redden for one reason: every precondition held,
  # the build ran, and it did not produce a binary.
  #
  # It was not always able to say that. This job and the battery below it used
  # to be one job, and that job rendered identically whether the tier had
  # answered a program wrongly or `musl.libc.org` had merely stopped answering
  # — which it did, for four consecutive runs, while the whole battery under it
  # silently never ran. A gate whose red has two meanings has none.
  #
  # `--skip-unavailable` is what buys the distinction: a tier that cannot be
  # ATTEMPTED here — no 32-bit toolchain, no cargo, an unreachable pinned
  # download — exits 0 and says `unavailable`, and the `built` output below
  # carries that fact to the battery, which then skips rather than pretending.
  # A build that RAN and broke still exits 1 and still reddens this job.
  micropython-build:
    name: "micropython tier — does it build"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: the 32-bit toolchain
        # gcc-multilib is the whole reason this tier is absent by default:
        # lypning-mp is an i386 static musl binary, and its size is why it
        # starts as fast as it does. `lypning gate` prints the byte count that
        # matters; this comment deliberately does not quote one (invariant 3).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-multilib strace
      - name: build both tiers
        id: build
        # The Rust core first and WITHOUT --skip-unavailable: cargo is present
        # on this runner, so anything short of `ok` there is a real failure and
        # the `core` job's opinion of it is not a substitute for this one.
        run: |
          lypning build --rust
          lypning build --micropython --skip-unavailable
          # Asked of the engine finder rather than of a path or a grep over
          # `status`: this is the exact question the battery will ask, and the
          # tier legitimately lands in more than one place (the state bin dir in
          # a wheel, the asset build tree in a checkout).
          if python3 -c 'import sys; from lypning import engines; sys.exit(0 if engines.find_micropython() else 1)'; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "the tier built; the battery runs against it"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo '::warning title=MicroPython tier unavailable::This runner could not attempt the tier - see the "unavailable:" reason in the build table above. The conformance battery is SKIPPED, not passed.'
          fi
      - name: status
        run: lypning status
      - name: gate lypning-mp
        # With both built, a bare `lypning gate` picks lypning-mp — the tier the
        # byte budget was written for. Nothing to gate if it is not there.
        if: steps.build.outputs.built == 'true'
        run: lypning gate
      - name: stage the binaries for the battery
        # Staged into ONE directory before upload: given two paths,
        # upload-artifact roots the archive at their least common ancestor,
        # which for a state dir and a workspace path is `/` — and the job below
        # would unpack a deep tree where it expected two files. Asked of the
        # engine finders so the staging cannot disagree with what was found.
        if: steps.build.outputs.built == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/engines"
          python3 - <<'EOF'
          import os, shutil
          from lypning import engines
          out = os.path.join(os.environ["RUNNER_TEMP"], "engines")
          for find in (engines.find_lypning, engines.find_micropython):
              p = find()
              assert p is not None, find.__name__
              shutil.copy2(p, os.path.join(out, p.name))
              print("staged %s (%d B)" % (p, p.stat().st_size))
          EOF
      - name: keep them for the battery
        # So the job below runs against exactly what was built here, rather than
        # rebuilding and taking a second, independent chance at the same
        # upstream outage.
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engines
          path: ${{ runner.temp }}/engines
          if-no-files-found: error
          retention-days: 1

  # --- known red, on purpose, by identity and not by count -------------------
  #
  # NON-BLOCKING, and it fails today. `lypning conformance` over all three arms
  # ends on lypning-mp mismatches with one cause: MicroPython streams stdout, so
  # a program that prints before reaching an unsupported construct has already
  # committed those bytes when it exits 90. The routing gate reports the
  # consequence as UNSAFE. docs/LYPNING.md §6 has the reproduction, CHANGELOG.md
  # records why it is tracked rather than waived.
  #
  # Those mismatches are enumerated in .github/known-mismatches.json BY IDENTITY
  # — engine, entry, kind — and never by count. A count would let one defect be
  # fixed while another appeared and keep the tick green, which is invariant 1's
  # silent failure with a badge on it. Anything not in that file reddens the
  # step below; so does a ledger entry that has stopped reproducing.
  #
  # It SKIPS, visibly, when the tier could not be built. That is the whole point
  # of the split: this job's red now means a wrong answer and nothing else.
  #
  # WHAT MAKES IT BLOCKING: when lypning-mp grows a commit barrier and the
  # ledger empties, delete `continue-on-error` here and replace the `core` job's
  # `--engine lypning --engine mixture` with a bare `lypning conformance`.
  micropython-conformance:
    name: "micropython tier — does it agree with CPython (non-blocking: known red)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: micropython-build
    if: needs.micropython-build.outputs.built == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: the binaries the build job produced
        uses: actions/download-artifact@v4
        with:
          name: engines
          # NOT the workspace. The last step of this job fails on any change to
          # the tree, and `git status --porcelain` counts untracked files — two
          # engine binaries unpacked next to the checkout would fail the net
          # check while reporting the battery had rewritten the repository.
          path: ${{ runner.temp }}/engines
      - name: put them where the engine finders look
        # Into the state bin dir, which is the first place both finders look in
        # either shape of install, and chmod +x because the artifact store does
        # not preserve the bit. `status` is the assertion: if either engine is
        # missing here, every arm below silently degrades to CPython and the
        # battery reports a clean run of nothing.
        run: |
          mkdir -p "$HOME/.lypning/bin"
          cp "$RUNNER_TEMP/engines/lypning" "$RUNNER_TEMP/engines/lypning-mp" "$HOME/.lypning/bin/"
          chmod +x "$HOME/.lypning/bin/lypning" "$HOME/.lypning/bin/lypning-mp"
          lypning status
          python3 -c 'from lypning import engines; assert engines.find_lypning() and engines.find_micropython(), "an engine did not survive the artifact round-trip"'
      - name: pytest, with both tiers present
        # The commit-barrier cases in tests/test_commit_barrier.py can only run
        # here; everywhere else they skip for want of a binary.
        run: python -m pytest tests -q
      - name: the full battery, scored against the accepted-mismatch ledger
        # `conformance` itself is absolute and exits 1 on any MISMATCH — that is
        # invariant 1 and it does not bend. The ledger decides this JOB's
        # outcome, and only this job's: a mismatch it does not name is a
        # regression, and a mismatch it names that stopped reproducing is good
        # news that still needs the file edited.
        run: |
          lypning conformance --json > "$RUNNER_TEMP/conformance.json" || true
          python3 .github/scripts/known-mismatches.py \
            --report "$RUNNER_TEMP/conformance.json" \
            --ledger .github/known-mismatches.json
      - name: the battery in the vocabulary a human reads
        if: always()
        run: lypning conformance || true
      - name: what the refusals say to build next
        if: always()
        run: lypning conformance --plan
      - name: the corpus rewrites repositories; check the net held
        if: always()
        run: |
          dirty=$(git status --porcelain)
          test -z "$dirty" || { echo "$dirty"; echo "the battery changed tracked files"; exit 1; }

  # --- the artefacts a `pip install` actually gets --------------------------
  #
  # The wheel path is the one nobody tests by accident: assets are read-only,
  # `build_dir()` falls back to ~/.lypning/build, and the shell hook scripts may
  # not have shipped at all. Everything here is done against the built artefacts
  # in a venv that has never seen the checkout.
  packaging:
    name: sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build and lint the artefacts
        # `make dist-check` is `python -m build`, `twine check` on both, and the
        # assertion that no build output rode along in the wheel. Both tools are
        # dev-only: neither is a runtime dependency and neither may become one.
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          make dist-check
      - name: upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: install the wheel into a venv that has never seen this checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/lypning" --version
          "$RUNNER_TEMP/venv/bin/lypning" status
          "$RUNNER_TEMP/venv/bin/lypning" corpus --stats
          "$RUNNER_TEMP/venv/bin/lypning" install --dry-run
          test "$("$RUNNER_TEMP/venv/bin/lypning" run -c 'print(2**8)')" = 256
      - name: build the core out of the installed wheel
        # The read-only-assets path: with no writable package tree, cargo must
        # build under $LYPNING_HOME/build and install into $LYPNING_HOME/bin.
        # A wheel whose engines cannot be built is a CLI that always routes to
        # CPython, which is the failure this job exists to catch.
        env:
          LYPNING_HOME: ${{ runner.temp }}/lyp-state
        run: |
          "$RUNNER_TEMP/venv/bin/lypning" build --rust
          "$RUNNER_TEMP/venv/bin/lypning" status
          "$RUNNER_TEMP/venv/bin/lypning" gate
          test "$("$RUNNER_TEMP/venv/bin/lypning" route -c 'print(2**8)')" = "lypning"
      - name: the sdist can build the engines it ships the source of
        # An sdist that unpacks to something un-buildable is the same failure as
        # a missing file, one step later. Built in a directory of its own so
        # nothing here can resolve back to the checkout.
        env:
          LYPNING_HOME: ${{ runner.temp }}/sdist-state
        run: |
          mkdir -p "$RUNNER_TEMP/sdist" && tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"/lypning-*
          PYTHONPATH=src python -m lypning build --rust
          PYTHONPATH=src python -m lypning gate
          PYTHONPATH=src python -m lypning conformance --engine lypning --engine mixture

  site:
    # The docs site is a rendering of the repository's own markdown, so a
    # renamed doc or a moved heading breaks a cross-reference. `--check` fails
    # here, on the pull request, rather than shipping a 404 to a reader.
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: python3 site/build.py --out _site --check
