name: Cerebras OpenCode project harvest

# No PR/push/schedule trigger: only an explicitly budgeted operator dispatch.
on:
  workflow_dispatch:
    inputs:
      catalog:
        description: 'Reviewed project tasks or question-bank proposal producers'
        type: choice
        options: [projects, questions]
        default: projects
      profile:
        description: 'Baseline or matched-budget reasoning comparison (same total token ceiling)'
        type: choice
        options: [baseline, compare-none, compare-medium, question-proposals]
        default: baseline
      start_index:
        description: 'First task in the reviewed catalog (zero-based; page larger catalogs)'
        type: number
        default: 0
      projects:
        description: 'Catalog tasks per batch (1-12, must fit selected catalog)'
        type: number
        default: 4
        required: true
      rounds:
        description: 'Independent sessions per project (1-4; same-family lineage)'
        type: number
        default: 1
        required: true
      parallelism:
        description: 'Concurrent isolated GitHub jobs (1-4)'
        type: number
        default: 4
        required: true
      dry_run:
        description: 'Exercise the full parallel matrix with a fake provider; no API secret or spend'
        type: boolean
        default: false

permissions:
  contents: read

# Do not multiply spend across overlapping dispatches. Never cancel evidence
# collection midway to make room for another batch.
concurrency:
  group: cerebras-project-harvest
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      parallelism: ${{ steps.plan.outputs.parallelism }}
    env:
      PYTHONPATH: src:training
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          PROJECTS: ${{ inputs.projects }}
          ROUNDS: ${{ inputs.rounds }}
          PARALLELISM: ${{ inputs.parallelism }}
          CATALOG: ${{ inputs.catalog }}
          START_INDEX: ${{ inputs.start_index }}
        run: |
          MATRIX=$(python -m harvesting.runner --plan --projects "$PROJECTS" --rounds "$ROUNDS" --parallelism "$PARALLELISM" --catalog "$CATALOG" --start-index "$START_INDEX")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "parallelism=$PARALLELISM" >> "$GITHUB_OUTPUT"
      - name: Validate exact account-visible Qwen model (no generation)
        if: ${{ !inputs.dry_run }}
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python -m harvesting.preflight

  harvest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallelism) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONPATH: src:training
      LYPNING_CAPTURE: '0'
      LYPNING_HARVEST: '0'
      CATALOG: ${{ inputs.catalog }}
      GENERATION_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned agent and proxy without any API key
        run: |
          docker build -f training/harvesting/Dockerfile.opencode -t harvest-worker training/harvesting
          docker build -f training/harvesting/Dockerfile.proxy -t harvest-proxy training/harvesting
      - name: Harvest one isolated project (observations, not labels)
        if: ${{ !inputs.dry_run }}
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TASK_INDEX: ${{ matrix.task_index }}
          ROUND_INDEX: ${{ matrix.round }}
        run: |
          python -m harvesting.runner --task-index "$TASK_INDEX" --round "$ROUND_INDEX" --output work/harvest \
            --catalog "$CATALOG" --profile "$GENERATION_PROFILE" \
            --worker-image "$(docker image inspect harvest-worker --format '{{.Id}}')" \
            --proxy-image "$(docker image inspect harvest-proxy --format '{{.Id}}')"
      - name: Exercise the same matrix and container path without any secret or API calls
        if: inputs.dry_run
        env:
          TASK_INDEX: ${{ matrix.task_index }}
          ROUND_INDEX: ${{ matrix.round }}
        run: |
          python -m harvesting.runner --smoke --task-index "$TASK_INDEX" --round "$ROUND_INDEX" --output work/harvest \
            --catalog "$CATALOG" --profile "$GENERATION_PROFILE" \
            --worker-image "$(docker image inspect harvest-worker --format '{{.Id}}')" \
            --proxy-image "$(docker image inspect harvest-proxy --format '{{.Id}}')"
          python -m harvesting.check_smoke work/harvest
      - name: Preserve successes, failures and partial runs; no training or upload elsewhere
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.task_index }}-${{ matrix.round }}
          path: work/harvest
          retention-days: 14
          if-no-files-found: warn
