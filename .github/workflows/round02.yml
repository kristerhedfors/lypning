# Round-02 launch from CI. A GitHub runner is a disposable Linux VM with no
# sensitive files, which is what `--isolated-worker` attests; the GPU itself is
# a Hugging Face Job this workflow submits, never the runner.
#
# Two halves, and only the second one costs money:
#   preflight  — free. Reads the account, the Jobs hardware table and its price,
#                the Qwen revision and the work-repo state. Always runs.
#   submit     — billed. Runs ONLY when the head commit message contains the
#                marker below, so a routine push to this branch can never bill.
name: round-02

on:
  push:
    branches: ["round02/**"]
  workflow_dispatch:
    inputs:
      stage:
        description: "smoke (starter fixture), pilot (needs a reviewed bank), hwsmoke (h200 measurement, no bank), eval2 (a deferred pilot's eval-2; needs eval2_of) or finish (test and eval-2 of a pilot that completed SFT; needs finish_of and sft_step)"
        default: smoke
        type: choice
        options: [smoke, pilot, hwsmoke, eval2, finish]
      submit:
        description: "type SUBMIT to actually bill a GPU job"
        default: ""
        type: string
      target_run:
        description: "graded positive-control run id supplying private rejection targets"
        default: ""
        type: string
      seed:
        description: "training seed of this S4 replicate (the split stays at PILOT_SPLIT_SEED)"
        default: "1111"
        type: choice
        options: ["1111", "2222", "3333"]
      bundles_from:
        description: "pilot: reuse the bundles an earlier job prepared, as round-02/<24-hex HF job id>; empty prepares afresh"
        default: ""
        type: string
      eval2_of:
        description: "eval2: the completed pilot job (24-hex HF job id) that ran with PILOT_EVAL2 separate"
        default: ""
        type: string
      finish_of:
        description: "finish: the pilot job (24-hex HF job id) that completed SFT and died before its test and eval-2"
        default: ""
        type: string
      sft_step:
        description: "finish: the SFT checkpoint to evaluate; a step other than the pilot's rule-selected one must be registered in training/hf/finish_lineage.py OVERRIDES"
        default: ""
        type: string

permissions:
  contents: read

env:
  MARKER: "[submit-smoke]"
  SPACE_REPO_NAME: lypning-round02-verifier
  WORK_REPO_NAME: lypning-round02-artifacts
  QWEN_MODEL: Qwen/Qwen3.8-27B
  # THE BASE MODEL IS PINNED, not resolved. This is the commit Actions run
  # 35762924601 (2026-09-22) resolved `main` to and counted the rejection
  # targets' tokens against. It used to be whatever `main` was at dispatch, so
  # an upstream tokenizer or chat-template commit between two seeds of one arm
  # would have changed the second seed's base model and nothing would have
  # said so. The preflight now FAILS if the Hub head differs from this pin:
  # moving it is a decision about every seed of the arm, made by editing here.
  QWEN_REV: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  FLAVOR: a10g-small
  # The carved bank a round reads: a pilot and a held-out benchmark sharing no
  # family, cut from six batches on 2026-09-19 by `bank-publish.yml`
  # (run 35462243227), capped at 45 cases per family: 2,079 pilot cases over 48
  # families and 893 benchmark cases over 21. The cap is a clock decision, not
  # a statistical one -- `training-prepare` verifies ~1 case every 4 s through
  # the 16-sandbox pool, so the uncapped 8,370/4,633 bank is 10.7 h of
  # preparation before a single optimizer step, and the round of 2026-09-19
  # died at six hours inside it. Family count, which the floors and the cluster
  # bootstrap read, is untouched. Five families are ALSO excluded by name --
  # locale, zoneinfo, gzip, pickle and time -- because their answers depend on
  # the clock, the container's installed locales or its tz database; one such
  # case ended the round of 2026-09-20 at `last_stage: prepare`, and a
  # per-case reference check run on a GitHub runner cannot see it, because
  # ubuntu-latest ships locales the verifier's slim image does not.
  # Verified on this bank (run 35491218203): 1,355/1,386/1,373 train cases
  # against the 1,000 floor, 246,723/229,367/198,895 supervised tokens against
  # the 50,000 floor.
  # `banks/v2` is kept on the Hub and is not this: its completed base arm left
  # 3.14pp of headroom against a 3.00pp bar, so a round on it could not fire
  # the preregistered rule.
  BANK_PATH: banks/v3-20260920b
  # A 27B model loads in full bf16 with no quantization (~54 GB of weights), so
  # the smoke's 24 GB a10g-small cannot hold it. A pilot needs an 80 GB-class
  # flavor; the preflight prints the whole priced table so this is a decision
  # with a number attached rather than a guess.
  PILOT_FLAVOR: h200
  # The schedule the token-floor job above counts and the submit below runs, so
  # the number that was checked is the number that is billed. ONE PASS over
  # arm A's operator-approved targets (2026-09-23): target_arms bare,subset-spec
  # from merge 35913600534, 4,197 rows over 1,291 cases, is ceil(4,197 / 4) =
  # 1,050 steps at batch 4. At the 300 this replaced, the schedule exposed
  # 1,200 rows and most target rows were never seen (`PLAN.md` Step 2). The
  # token-floor job counts this number before any submit; the gate makes it.
  PILOT_STEPS: "1050"
  # SFT's dev-evaluation cadence, operator-approved with the dose: evaluations
  # at 350, 700 and 1050, and step 0. Every evaluation is a full dev pass at
  # PILOT_DEV_EVAL_DRAWS, so this is most of the SFT stage's clock
  # (`training/hf/projection.py`). An arm field, recorded in the manifest.
  PILOT_EVAL_EVERY: "350"
  # Where eval-2 runs: `same-job`, or `separate` -- the pilot stops after the
  # test split and an `eval2` dispatch (eval2_of = that job) runs 7g from its
  # sealed selection. Scheduling, not the arm. `separate` since the h200
  # hardware smoke (job 6ab4582d6b030d633f68c90e, 2026-09-24): even without the
  # probe and with SFT step 0 reused, the whole arm in one job projects over
  # the 648-minute budget at every reading but the lowest; the two jobs'
  # projections, and which of them fit, are in `training/PLAN.md` Step 4.
  PILOT_EVAL2: "separate"
  # The hardware smoke's ceiling: deps, the 55 GB pull, one load, three generate
  # calls and 34 SFT steps, on the pilot's flavor (launch.py HWSMOKE_TIMEOUT).
  HWSMOKE_TIMEOUT: "90m"
  # PLAN Step 1.5: a twelve-hour ceiling, independently enforced in-container.
  # This is a maximum, not an estimate or spend approval; preflight still gates
  # every new arm and prints current hardware pricing.
  PILOT_TIMEOUT: "720m"
  # Throughput, bought where it is a COST decision and not an instrument one.
  # Preparation runs at ~4 s/case through 16 scorers and is the stage that ended
  # two rounds at the wall; 64 scorers is four times that. Sandboxes PER HOST
  # stays at the decided 4 — `native` is host-load-dependent, so density changes
  # what the label means, while host count is cents on `cpu-basic` beside an
  # h200 at $5/h.
  # 48, not 64: the pool has 16 x 4 = 64 slots and RAISES rather than waits
  # once they are all taken, so scorers equal to capacity leaves nothing for
  # a sandbox still winding down. 6ab01391 (2026-09-20) died on that, at the
  # second stage, after the pilot bundle was already built.
  PILOT_SCORERS: "48"
  PILOT_POOL_HOSTS: "16"
  # S4 arm A is rejection-sampling SFT and nothing after it: the job skips the
  # probe and GRPO and writes grpo-skipped.json (a probe binds its adapter and
  # code, so arm C re-probes in its own job). The only GRPO dose this workflow
  # ever billed was 20 steps x 4 generations, the one PLAN.md retired with seed
  # 1111's configuration; arm C sets its own dose here, in a reviewed commit,
  # when it is launched.
  PILOT_GRPO_STEPS: "0"
  # Arm C's group size and prompt groups per GRPO step, passed so that arm C's
  # dose is one reviewed edit here rather than a launcher default nobody saw.
  # 4 and 4 are launch.py's defaults (seed 1111's group size); with
  # PILOT_GRPO_STEPS at 0 neither the probe nor GRPO runs, so nothing reads them.
  PILOT_GRPO_GENERATIONS: "4"
  PILOT_GRPO_PROMPTS: "4"
  # Dev draws per case in the stages that SELECT a checkpoint. It used to be
  # absent, so launch.py's DEFAULT_DEV_EVAL_DRAWS (4) applied without anyone
  # choosing it. 16 is the operator's arm-A decision of 2026-09-23, taken
  # after the draw-coupling read (Actions 35849854123: dev draws effectively
  # independent, where the Step 1 simulation puts selection power below 80% at
  # 4), in this reviewed commit before the arm's first seed -- never between
  # two seeds.
  PILOT_DEV_EVAL_DRAWS: "16"
  # The split every seed of the arm trains and is measured on; the dispatch
  # `seed` input moves only initialisation and data order (launch.py says why).
  PILOT_SPLIT_SEED: "1111"
  PILOT_SEED: ${{ github.event.inputs.seed || '1111' }}
  SFT_TARGET_RUN: ${{ github.event.inputs.target_run || '' }}
  # Seeds 2222 and 3333 train on split 1111, so they can reuse the bundles
  # seed 1111's job prepared instead of spending ~45 GPU-idle minutes
  # re-verifying the same cases. The job re-checks the reused bundles' Space
  # revision and engine identity itself; only the shape is checked in `submit`.
  PILOT_BUNDLES_FROM: ${{ github.event.inputs.bundles_from || '' }}
  EVAL2_OF: ${{ github.event.inputs.eval2_of || '' }}
  # A finish runs a pilot's test split and eval-2 from ONE saved SFT adapter.
  # The step is checked in `submit` for shape only; the job refuses a step the
  # pilot's rule did not select unless `finish_lineage.OVERRIDES` registers it
  # with its dated amendment, so a dispatch input cannot pick a checkpoint.
  FINISH_OF: ${{ github.event.inputs.finish_of || '' }}
  SFT_STEP: ${{ github.event.inputs.sft_step || '' }}

jobs:
  preflight:
    name: preflight (free — no job submitted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      whoami: ${{ steps.probe.outputs.whoami }}
      qwen_rev: ${{ steps.probe.outputs.qwen_rev }}
      jobs_ok: ${{ steps.probe.outputs.jobs_ok }}
      hourly_usd: ${{ steps.probe.outputs.hourly_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "huggingface-hub==1.31.0"
      # Priced at the flavor that would be billed: a pilot is an h200, and
      # pricing the smoke's a10g-small for it let an account without h200
      # access pass this step.
      - name: Probe the account, the price and the model revision
        id: probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FLAVOR: >-
            ${{ (contains(github.event.head_commit.message, '[submit-pilot]') ||
                 github.event.inputs.stage == 'pilot' || github.event.inputs.stage == 'hwsmoke' ||
                 github.event.inputs.stage == 'eval2' || github.event.inputs.stage == 'finish') &&
                 env.PILOT_FLAVOR || env.FLAVOR }}
        run: python .github/scripts/round02_preflight.py

  # Free. Building the Space and the artifact repo is idempotent and costs
  # nothing, so it runs on every push to this branch: a bootstrap failure is
  # then a red run rather than a surprise after the meter has started.
  bootstrap:
    name: bootstrap the Hub artifacts (free)
    needs: preflight
    if: needs.preflight.outputs.jobs_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      space_repo: ${{ steps.space.outputs.space_repo }}
      space_rev: ${{ steps.space.outputs.space_rev }}
      owner: ${{ steps.space.outputs.owner }}
    env:
      PYTHONPATH: src:training
      LYPNING_CAPTURE: "0"
      LYPNING_HARVEST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Isolate engine state
        run: echo "LYPNING_HOME=$RUNNER_TEMP/round02-home" >> "$GITHUB_ENV"
      - run: pip install -q -e . && pip install -q "huggingface-hub==1.31.0"

      # The engine the verifier image carries. Built here so the Space is made
      # from the same commit the job will clone.
      - name: Build lypning-l against this 3.12
        run: |
          python -m lypning build --rust --target host
          "$LYPNING_HOME/bin/lypning-l" --version

      # The verifier Space: a private Docker Space whose context is exactly the
      # four reviewed files. Its 40-character commit is what the bundle pins, so
      # a host booted from an earlier build can never serve a later bundle.
      #
      # A finish HOLDS the Space: it runs at the revision its pilot pinned and
      # the pool serves only the head, so an upload that is not byte-identical
      # (a newer rustc on the runner image is enough) would move the head past
      # that revision for good. It reads the head, wakes it, and pins that.
      - name: Create or update the verifier Space, and record its commit
        id: space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_HOLD: ${{ github.event.inputs.stage == 'finish' && '1' || '' }}
        run: python .github/scripts/round02_space.py

      - name: Ensure the private artifact repo exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/round02_workrepo.py

      # The banks the pilot reads. Committed to git for review; copied here
      # because the token only exists inside the job.
      - name: Publish the committed bank to the private dataset repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/round02_bank.py

      # Only meaningful for the committed bank, which is the one in the
      # checkout. A bank cut by `bank-publish.yml` is guaranteed disjoint at
      # carve time -- `bank_carve.carve` asserts no family reaches both halves
      # and refuses to write otherwise -- and checking bank v2 while the round
      # reads another bank is a guard that passes about the wrong thing.
      - name: The benchmark must not overlap the training bank
        run: |
          set -euo pipefail
          if [ "${BANK_PATH}" = "banks/v2" ]; then
            PYTHONPATH=src:training python -m pipeline.cli eval2-leaks \
              training/data/bank_v2/eval2.jsonl training/data/bank_v2/train.jsonl
          else
            echo "BANK_PATH is ${BANK_PATH}: a carved bank, disjoint by construction"
            echo "(pipeline.bank_carve refuses to write two banks that share a family)"
          fi

      # Free: prints the plan and the hourly price, submits nothing. Every run
      # of this branch therefore states what a submit would cost.
      - name: Dry run — print the plan and its price
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_REPO: ${{ steps.space.outputs.space_repo }}
          SPACE_REV: ${{ steps.space.outputs.space_rev }}
          OWNER: ${{ steps.space.outputs.owner }}
        run: |
          python training/hf/launch.py smoke \
            --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
            --space "${SPACE_REPO}" --space-revision "${SPACE_REV}" \
            --qwen-revision "${QWEN_REV}" \
            --work-repo "${OWNER}/${WORK_REPO_NAME}" \
            --flavor "${FLAVOR}" --timeout 75m

  # Free, and it stands between the marker and the meter. Measured 2026-09-19
  # on `banks/v2` (run `35434623069`): the pilot's own `--steps 250
  # --batch-size 4` exposes 46,535 / 45,952 / 44,940 supervised tokens at the
  # three protocol seeds against a 50,000 floor, so `run()` refuses it BEFORE
  # the first optimizer step — after the dependency install, the bank
  # download, bundle preparation, the unadapted base-dev arm and 55.6 GB of
  # weights. The `--plan` bound for the same schedule is 134,384 and passes,
  # which is why a passing plan was never a certificate. This counts exactly,
  # needs only the tokenizer, and costs nothing.
  #
  # It needs bootstrap because the targets' engine lineage is compared against
  # the `lypning-l` the pilot will download from the Space at the revision
  # bootstrap just pinned; the job's trainer refuses a mismatch only at its
  # plan stage, after ~45 minutes of GPU-idle preparation. And it counts at
  # the dispatched training seed on the fixed split, which is what that seed
  # trains on.
  token-floor:
    name: the supervised-token floor, counted before it is billed
    needs: [preflight, bootstrap]
    if: >-
      contains(github.event.head_commit.message, '[submit-pilot]') ||
      (github.event.inputs.stage == 'pilot' && github.event.inputs.submit == 'SUBMIT')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONPATH: src:training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "transformers==5.17.0" "huggingface-hub==1.31.0" jinja2
      - name: Count what the schedule exposes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_REPO: ${{ needs.bootstrap.outputs.space_repo }}
          SPACE_REV: ${{ needs.bootstrap.outputs.space_rev }}
        run: |
          if [ -z "${SFT_TARGET_RUN}" ]; then
            echo "pilot submit requires target_run from a graded positive control" >&2
            exit 1
          fi
          python .github/scripts/s4_target_floor.py \
            --target-run "${SFT_TARGET_RUN}" \
            --bank-path "${BANK_PATH}" \
            --revision "${QWEN_REV}" \
            --steps "${PILOT_STEPS}" \
            --seed "${PILOT_SEED}" --split-seed "${PILOT_SPLIT_SEED}" \
            --space "${SPACE_REPO}" --space-revision "${SPACE_REV}" \
            --out "$RUNNER_TEMP/s4-target-floor.json"
      # Uploaded on a refusal too: the report is written either way, and a
      # refused floor is the finding.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s4-target-floor
          path: ${{ runner.temp }}/s4-target-floor.json
          if-no-files-found: ignore

  # A pilot submit needs the floor to have PASSED; a smoke submit has no floor
  # job at all. Without a status function a skipped token-floor skips this job
  # too (GitHub's implicit success()), which made every smoke submit
  # unreachable. So the status of each need is spelled out, and a smoke is a
  # smoke only when nothing asked for a pilot -- a message carrying both
  # markers is a pilot. `!cancelled()`, not `always()`: always() is true in a
  # cancelled run too, so cancelling after bootstrap would still bill a smoke.
  # The hardware smoke, the split eval-2 and the finish are dispatch-only: no
  # commit marker reaches them, and each needs submit=SUBMIT.
  submit:
    name: submit the GPU job (BILLED)
    needs: [preflight, bootstrap, token-floor]
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' && needs.bootstrap.result == 'success' && (
        ((contains(github.event.head_commit.message, '[submit-pilot]') ||
          (github.event.inputs.stage == 'pilot' && github.event.inputs.submit == 'SUBMIT')) &&
         needs.token-floor.result == 'success') ||
        ((github.event.inputs.stage == 'hwsmoke' || github.event.inputs.stage == 'eval2' ||
          github.event.inputs.stage == 'finish') &&
         github.event.inputs.submit == 'SUBMIT') ||
        (!contains(github.event.head_commit.message, '[submit-pilot]') &&
         github.event.inputs.stage != 'pilot' &&
         (contains(github.event.head_commit.message, '[submit-smoke]') ||
          (github.event.inputs.stage == 'smoke' && github.event.inputs.submit == 'SUBMIT'))))
    runs-on: ubuntu-latest
    # THE FOLLOWER NOW DIES BEFORE THE ROUND DOES, ON PURPOSE. The pilot is
    # submitted with PILOT_TIMEOUT (720m) and GitHub caps a hosted job at 360
    # minutes, so this cannot outlive it and 350 is the most it can watch. The
    # HF job keeps running and still uploads its round directory; what is lost
    # is the stream, not the round. `hf-status.yml` reads the side that knows,
    # and a red X on this job after ~6 h means the follower expired, NOT that
    # the round failed -- on 2026-09-19 that distinction was the whole
    # difference between "it died" and "it is still going".
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "huggingface-hub==1.31.0"
      # --follow streams the job's own log into this run, so the evidence for
      # what the GPU actually did lives beside the decision to spend on it.
      # Every value reaches the script through env, never by expansion into
      # its text: a commit message is author-controlled, and one holding a
      # quote or `$(...)` would have run inside a step that holds HF_TOKEN.
      - name: Submit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          STAGE_IN: ${{ github.event.inputs.stage }}
          SPACE_REPO: ${{ needs.bootstrap.outputs.space_repo }}
          SPACE_REV: ${{ needs.bootstrap.outputs.space_rev }}
          OWNER: ${{ needs.bootstrap.outputs.owner }}
        run: |
          # The hardware smoke: the pilot's flavor, its own 90m ceiling, no bank.
          if [ "${STAGE_IN}" = "hwsmoke" ]; then
            python training/hf/launch.py hwsmoke \
              --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
              --space "${SPACE_REPO}" --space-revision "${SPACE_REV}" \
              --qwen-revision "${QWEN_REV}" \
              --work-repo "${OWNER}/${WORK_REPO_NAME}" \
              --flavor "${PILOT_FLAVOR}" --timeout "${HWSMOKE_TIMEOUT}" --yes --follow
          # A deferred pilot's eval-2: one HF job id, validated on the whole
          # value as bundles_from is, and the pilot's own evaluation knobs; the
          # job refuses any arm field that is not that pilot job's.
          elif [ "${STAGE_IN}" = "eval2" ]; then
            if ! [[ "${EVAL2_OF}" =~ ^[0-9a-f]{24}$ ]]; then
              echo "eval2_of must be a 24-hex HF job id" >&2
              exit 1
            fi
            python training/hf/launch.py eval2 \
              --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
              --space "${SPACE_REPO}" --space-revision "${SPACE_REV}" \
              --qwen-revision "${QWEN_REV}" \
              --work-repo "${OWNER}/${WORK_REPO_NAME}" \
              --eval2-of "${EVAL2_OF}" --eval-draws 16 --seed "${PILOT_SEED}" \
              --score-workers "${PILOT_SCORERS}" --pool-max-hosts "${PILOT_POOL_HOSTS}" \
              --flavor "${PILOT_FLAVOR}" --timeout "${PILOT_TIMEOUT}" --yes --follow
          # A finish: one HF job id and one positive step, each validated on
          # the whole value; then, for free, the pilot's recorded Space
          # revision must still be the head bootstrap resolved, because the
          # pool serves only the head and the job would refuse it after deps.
          # Every other identity field is refused in the job, before a load.
          elif [ "${STAGE_IN}" = "finish" ]; then
            if ! [[ "${FINISH_OF}" =~ ^[0-9a-f]{24}$ ]]; then
              echo "finish_of must be a 24-hex HF job id" >&2
              exit 1
            fi
            if ! [[ "${SFT_STEP}" =~ ^[1-9][0-9]*$ ]]; then
              echo "sft_step must be a positive integer" >&2
              exit 1
            fi
            python .github/scripts/finish_preflight.py
            python training/hf/launch.py finish \
              --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
              --space "${SPACE_REPO}" --space-revision "${SPACE_REV}" \
              --qwen-revision "${QWEN_REV}" \
              --work-repo "${OWNER}/${WORK_REPO_NAME}" \
              --finish-of "${FINISH_OF}" --sft-step "${SFT_STEP}" --eval-draws 16 \
              --seed "${PILOT_SEED}" --split-seed "${PILOT_SPLIT_SEED}" \
              --score-workers "${PILOT_SCORERS}" --pool-max-hosts "${PILOT_POOL_HOSTS}" \
              --flavor "${PILOT_FLAVOR}" --timeout "${PILOT_TIMEOUT}" --yes --follow
          # A pilot is a banked stage: it needs the bank, a bigger GPU and a
          # longer timeout, and it carries the k/seed/case/token floors.
          elif [ "${STAGE_IN}" = "pilot" ] || \
             printf '%s' "${HEAD_MSG}" | grep -q '\[submit-pilot\]'; then
            if [ -z "${SFT_TARGET_RUN}" ]; then
              echo "pilot submit requires target_run from a graded positive control" >&2
              exit 1
            fi
            # One job directory of the private artifact repo and nothing
            # else: no absolute path, no `..`, no other prefix. HF job ids are
            # 24 lower-case hex characters (round-02/6ab01cbb51992417dfccd64c).
            # Matched on the WHOLE value by bash, not by `grep -x`, which
            # matches line by line: a dispatch input sent through the API can
            # hold a newline, and one valid line would admit the rest.
            if [ -n "${PILOT_BUNDLES_FROM}" ] && \
               ! [[ "${PILOT_BUNDLES_FROM}" =~ ^round-02/[0-9a-f]{24}$ ]]; then
              echo "bundles_from must be round-02/<24-hex HF job id>" >&2
              exit 1
            fi
            python training/hf/launch.py pilot \
              --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
              --space "${SPACE_REPO}" --space-revision "${SPACE_REV}" \
              --qwen-revision "${QWEN_REV}" \
              --work-repo "${OWNER}/${WORK_REPO_NAME}" \
