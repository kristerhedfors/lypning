name: Step 2 grade Cerebras control (no GPU)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Private positive-control run id
        required: true
        type: string
      rung:
        description: Rung generated by that run
        required: true
        type: choice
        options: [smoke, targets, budget20, confirmatory]
      target_arms:
        description: Arms harvested into SFT targets (subset-spec is the reviewed default)
        required: true
        type: choice
        options: [subset-spec, bare, 'bare,subset-spec']
        default: subset-spec

permissions:
  contents: read

env:
  PYTHONPATH: src:training
  LYPNING_CAPTURE: '0'
  LYPNING_HARVEST: '0'
  STEP2_CASES: ${{ inputs.rung == 'smoke' && '64' || (inputs.rung == 'targets' || inputs.rung == 'budget20') && '192' || '300' }}
  STEP2_SAMPLES: ${{ (inputs.rung == 'smoke' || inputs.rung == 'targets') && '4' || '16' }}
  STEP2_RUN_ID: ${{ inputs.run_id }}
  STEP2_TARGET_ARMS: ${{ inputs.target_arms }}

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # transformers only for the tokenizer that sizes each SFT target against
      # max_new_tokens; the generation workflow pins the same two versions.
      - run: pip install -q 'huggingface-hub==1.31.0' 'transformers==5.17.0' jinja2
      - name: Download the named private generation evidence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/step2_private_download.py
      - name: Download the immutable private bank
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STEP2_DOWNLOAD_ONLY: '1'
        run: python .github/scripts/step2_bank_plan.py
      - name: Build the admitted engine and minimal verifier image
        run: |
          echo "LYPNING_HOME=$RUNNER_TEMP/step2-engine" >> "$GITHUB_ENV"
          LYPNING_HOME="$RUNNER_TEMP/step2-engine" python -m lypning build --rust --target host
          BASE=$(python -c 'import runpy; print(runpy.run_path("training/hf/launch.py")["BASE_IMAGE"])')
          CONTEXT=$(mktemp -d)
          cp training/pipeline/{sandbox,child_exec,container_worker}.py "$CONTEXT/"
          cp "$RUNNER_TEMP/step2-engine/bin/lypning-l" "$CONTEXT/"
          docker build --build-arg BASE_IMAGE="$BASE" -f training/worker/Dockerfile.verifier -t step2-grade-candidate "$CONTEXT"
          echo "CANDIDATE_IMAGE=$(docker image inspect step2-grade-candidate --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Grade every paired completion in isolated containers
        run: python .github/scripts/step2_grade.py
      - name: Persist private rows and report
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/step2_grade_upload.py
      - uses: actions/upload-artifact@v4
        with:
          name: step2-control-public-report
          path: ${{ runner.temp }}/step2-grade/public-report.json
          if-no-files-found: error
