# setuptools>=77 is the floor because of PEP 639 below — `license = "MIT"` as an
# SPDX string is a hard error on older setuptools, not a warning. Build
# isolation fetches it; a `--no-build-isolation` build needs it in the
# environment already (`pip install -U setuptools` first). `wheel` is not
# listed: setuptools has built wheels without it since 70.1, and naming it only
# pins a dependency nothing imports.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lypning"
version = "0.1.0"
description = "The Coding Harness Interpreter Optimizer: a tiny Python subset in Rust, a frozen-stdlib MicroPython, and the router that picks between them — for the one-liners coding agents actually type."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639, not the deprecated `{ file = "LICENSE" }` table — that form inlines
# the whole MIT text into the METADATA `License:` field and setuptools removes
# it on 2027-Feb-18. The SPDX expression plus license-files says the same thing
# in two machine-readable lines, and PyPI has rendered Metadata-Version 2.4
# since 2025.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krister Hedfors", email = "krister.hedfors@gmail.com" }]
keywords = ["python-subset", "interpreter", "micropython", "rust", "claude-code", "coding-agent", "sandbox", "benchmark"]
# No "License :: OSI Approved" classifier: PEP 639 replaced it with the
# expression above, and setuptools errors on both together. The version
# classifiers are a claim, so CI runs pytest on every one of them — 3.9 is the
# floor and it is enforced by executing it, not by asserting it here.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  # Claimed 2026-09-02, the day `lypning build --lib`, the library's own tests
  # (tests/test_embed.py) and every host quickstart passed on an arm64 Mac,
  # and the day the macos job in ci.yml started running the whole suite there.
  # The Rust core's static-musl gate is Linux-only; on a Mac the CLI, the
  # library tier and the hosts over it are what this line promises.
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Interpreters",
  "Topic :: Software Development :: Testing",
]
# ZERO runtime dependencies, on purpose. This package installs into the same
# environment as whatever the agent is working on; a dependency of ours is a
# version conflict in someone else's project.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Build-time only, for site/build.py. NOT runtime dependencies — the installed
# package has none, on purpose: it lands in the same environment as whatever the
# agent is working on, so a dependency of ours is a version conflict in someone
# else's project.
docs = ["markdown>=3.4", "pygments>=2.14"]

[project.urls]
Homepage = "https://github.com/kristerhedfors/lypning"
Source = "https://github.com/kristerhedfors/lypning"
Documentation = "https://github.com/kristerhedfors/lypning/tree/main/docs"
Changelog = "https://github.com/kristerhedfors/lypning/blob/main/CHANGELOG.md"
Issues = "https://github.com/kristerhedfors/lypning/issues"

[project.scripts]
lypning = "lypning.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lypning = [
  "assets/rust/Cargo.toml",
  "assets/rust/Cargo.lock",
  "assets/rust/src/*.rs",
  # Named explicitly, and it has to be: a wheel without it builds a binary 29 KB
  # larger than the checkout's — a whole CheerpX device block — and nothing in
  # any gate would say so, because both binaries pass everything. See the file.
  "assets/rust/.cargo/config.toml",
  # The C ABI's contract and every host over it (the table in
  # docs/EMBEDDING.md section 4 is the one place that counts them). Headers,
  # bindings and example sources are SOURCE, not build output — a wheel that
  # shipped the library but not the header would ship something no one can
  # compile against. Named by extension rather than by directory for the reason
  # the MANIFEST states at length: `include-package-data` means a careless glob
  # here puts cargo's `target/`, SwiftPM's `.build/` or npm's `node_modules/`
  # in everyone's wheel. tests/test_packaging.py holds every glob to matching
  # at least one file, so a renamed asset fails there and not in a `pip` user's
  # `lypning build`.
  "assets/include/*.h",
  "assets/include/*.hpp",
  "assets/examples/c/Makefile",
  "assets/examples/c/*.c",
  "assets/examples/cpp/Makefile",
  "assets/examples/cpp/*.cpp",
  "assets/examples/rust/Cargo.toml",
  "assets/examples/rust/Cargo.lock",
  "assets/examples/rust/.gitignore",
  "assets/examples/rust/src/*.rs",
  "assets/examples/rust/examples/*.rs",
  "assets/examples/python/*.py",
  "assets/node/*.js",
  "assets/node/*.ts",
  "assets/node/*.json",
  "assets/node/*.md",
  "assets/node/src/*.rs",
  "assets/node/Cargo.toml",
  "assets/node/Cargo.lock",
  # build.rs is a crate file like Cargo.toml: without it the addon links on
  # Linux and fails to link on macOS, where ld64 must be told the Node-API
  # symbols resolve at dlopen. The core crate's build.rs is the same story
  # for the library's @rpath install name.
  "assets/node/build.rs",
  "assets/rust/build.rs",
  # The Go module has zero dependencies, hence no go.sum to ship; the
  # `quickstart/` main package is source too.
  "assets/go/*.go",
  "assets/go/go.mod",
  "assets/go/README.md",
  "assets/go/quickstart/*.go",
  # SwiftPM: manifest, the swiftc Makefile for people without it, and the
  # module map, shim header, sources and tests one level under Sources/ and
  # Tests/. `*/*` is deliberate over `**`: a recursive glob would follow a
  # `.build/` that a user's `swift build` left behind.
  "assets/swift/Package.swift",
  "assets/swift/Makefile",
  "assets/swift/README.md",
  "assets/swift/Sources/*/*",
  "assets/swift/Tests/*/*",
  # LuaJIT: no build step, so nothing here is ever output.
  "assets/lua/*.lua",
  "assets/lua/README.md",
  "assets/micropython/Makefile",
  "assets/micropython/README.md",
  "assets/micropython/variant/*",
  "assets/micropython/variant/patches/*",
  "assets/micropython/lib/*.py",
  "assets/micropython/lib/*/*.py",
  "assets/micropython/lib/README.md",
  "assets/scripts/*.sh",
  "assets/shim/python-shim",
  "assets/corpus/*.jsonl",
  "assets/claude/skills/lypning/*.md",
  "assets/claude/hooks/*.sh",
  "assets/claude/*.json",
  "assets/opencode/*.js",
  "assets/opencode/*.md",
  "assets/openhands/*.json",
  "assets/openhands/*.md",
  "assets/prompt/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
