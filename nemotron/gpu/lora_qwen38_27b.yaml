# Rank-16 LoRA for Qwen/Qwen3.8-27B on one 8-GPU node.
#
# The target model as of 2026-09-11. Facts established from the checkpoint and
# from the NeMo AutoModel source, not from the model card:
#
#   DENSE, ~27.8B (55.6 GB BF16, 1199 tensors, ZERO expert tensors). Every
#   parameter is active on every token, unlike Nemotron 3.5 Lightning's
#   30B-A3B where only ~3B are. That is roughly 9x the FLOPs per token for the
#   same step count, and it is the single most important difference between
#   this recipe and the Nemotron one beside it.
#
#   HYBRID linear attention. `model.language_model.layers.N.linear_attn` carries
#   A_log / conv1d / dt_bias — a gated-delta-net, same family as Qwen3-Next —
#   with `full_attention_interval: 4`, so one layer in four is full attention.
#
#   MULTIMODAL. `model.visual` is 333 of the 1199 tensors. This task is text
#   only; the vision tower is frozen weight we pay to shard and never train.
#
#   model_type `qwen3_5`, natively implemented at
#   nemo_automodel/components/models/qwen3_5/model.py — so the backend overrides
#   below apply rather than falling back to the HF path.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16
  local_batch_size: 1
  ckpt_every_steps: 25
  val_every_steps: 25
  max_steps: 48          # ~3 epochs over the SFT set. Brief on purpose.

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.8-27B
  # MTP is left to auto-enable from the checkpoint (mtp_num_hidden_layers: 1).
  # The Nemotron recipe overrides num_nextn_predict_layers / mtp_use_repeated_layer
  # because its HF export keeps only the physical depth; whether qwen3_5 needs the
  # same override is NOT established here and must be checked against a real run
  # before anything is read off the loss curve.
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    # No `experts`/`dispatcher`: those are MoE token-routing knobs and this model
    # is dense. Setting ep_size or a dispatcher here would be cargo-culted from
    # the Nemotron recipe.
    #
    # qwen3_5/model.py:99 disables TE FUSED RoPE for this architecture — TE's
    # fused path expects 4D inputs that the shared Qwen3-Next attention block does
    # not give it. The model's own backend helper handles that; do not re-enable it.

checkpoint:
  enabled: true
  checkpoint_dir: /data/ckpt
  model_save_format: safetensors
  save_consolidated: final

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  # ONLY the vision tower. `*.out_proj` was excluded here until 2026-09-12 on a
  # rationale that was checked against the wrong line and was wrong for this
  # model.
  #
  # The Nemotron cookbook excludes it for a real reason: nemotron_v3/layers.py
  # passes `outproj_weight=self.out_proj.weight` INTO a fused kernel (layers.py
  # :454-455), so a LoRA wrapping the module is bypassed. Qwen3.5 does no such
  # thing — `output = self.out_proj(core_attn_out)` at cp_linear_attn.py:343 and
  # :715 is an ordinary module call on both paths, so a LoRA there applies
  # normally. The line originally cited as proof, qwen3_5/model.py:430, is inside
  # `for linear in (...): nn.init.trunc_normal_(linear.weight, ...)` — a weight
  # initialiser, not a kernel call, with out_proj listed beside four nn.Linear
  # siblings.
  #
  # Excluding it froze ~56 of the widest projections in the model and weakened
  # the intervention this run exists to measure. out_proj is absent from vLLM's
  # packed_modules_mapping and present unpacked in the checkpoint index, so
  # adapting it is safe to merge and to serve.
  exclude_modules: ["*visual*"]
  dim: 16
  alpha: 32
  use_triton: true

distributed:
  strategy: fsdp2
  dp_size: none          # shard across all 8; 55.6 GB of weights needs it
  tp_size: 1
  cp_size: 1
  ep_size: 1             # dense: there is nothing to expert-parallelise
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: true   # 27B dense, not 3B active — pay memory back in compute

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /data/sft.jsonl
  mask_generation_prompt: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /data/sft_val.jsonl
  mask_generation_prompt: true

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 5
  min_lr: 1.0e-5
