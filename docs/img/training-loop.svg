<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d">
<title id="t">The data-to-training loop</title>
<desc id="d">Seven stages: observe, snapshot, review, verify, train, evaluate, feed back. The last stage returns to the first through engine work and a new bundle.</desc>
<style>
  .bg   { fill: #fbfbfa; }
  .box  { fill: #f2f1ee; stroke: #d9d6cf; stroke-width: 1; }
  .hot  { fill: #f7ebe3; stroke: #9a4a20; stroke-width: 1.2; }
  .lane { fill: none; stroke: #e2e0da; stroke-width: 1; stroke-dasharray: 3 4; }
  .rule { stroke: #e2e0da; stroke-width: 1; }
  .axis { stroke: #b9b5ad; stroke-width: 1; }
  .ref  { stroke: #9a4a20; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .wire { stroke: #8d8981; stroke-width: 1.4; fill: none; }
  .head { fill: #8d8981; }
  .acc  { fill: #9a4a20; }
  .t    { fill: #1f1e1c; }
  .m    { fill: #6b6862; }
  .f    { fill: #8d8981; }
  .a    { fill: #9a4a20; }
  .s1   { fill: #2a78d6; }
  .s1l  { stroke: #2a78d6; stroke-width: 2; }
  .s2   { fill: #e34948; }
  .band1 { fill: #eef4fc; }
  .band2 { fill: #f7ebe3; }
  .band3 { fill: #edf6f1; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #16151a; }
    .box  { fill: #1e1d23; stroke: #3a3842; }
    .hot  { fill: #2b201b; stroke: #e0885a; }
    .lane { stroke: #2e2c34; }
    .rule { stroke: #2e2c34; }
    .axis { stroke: #5a5662; }
    .ref  { stroke: #e0885a; }
    .wire { stroke: #837e75; }
    .head { fill: #837e75; }
    .acc  { fill: #e0885a; }
    .t    { fill: #e8e6e1; }
    .m    { fill: #a9a49b; }
    .f    { fill: #837e75; }
    .a    { fill: #e0885a; }
    .s1   { fill: #3987e5; }
    .s1l  { stroke: #3987e5; }
    .s2   { fill: #e66767; }
    .band1 { fill: #1b2230; }
    .band2 { fill: #2b201b; }
    .band3 { fill: #19251f; }
  }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="330" rx="10"/>
<rect class="lane" x="12.0" y="30" width="412.0" height="186" rx="10"/>
<text class="f" x="218.0" y="48.0" font-size="10.5" text-anchor="middle" font-weight="700">DATA</text>
<rect class="lane" x="432.0" y="30" width="132.0" height="186" rx="10"/>
<text class="f" x="498.0" y="48.0" font-size="10.5" text-anchor="middle" font-weight="700">VERIFY</text>
<rect class="lane" x="572.0" y="30" width="132.0" height="186" rx="10"/>
<text class="f" x="638.0" y="48.0" font-size="10.5" text-anchor="middle" font-weight="700">LEARN</text>
<rect class="lane" x="712.0" y="30" width="272.0" height="186" rx="10"/>
<text class="f" x="848.0" y="48.0" font-size="10.5" text-anchor="middle" font-weight="700">DECIDE</text>
<rect class="box" x="16.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="78.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 1</text>
<text class="t" x="78.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Observe</text>
<text class="m" x="78.0" y="120.0" font-size="11.5" text-anchor="middle">capture hooks</text>
<text class="m" x="78.0" y="136.0" font-size="11.5" text-anchor="middle">and PATH shim</text>
<text class="m" x="78.0" y="152.0" font-size="11.5" text-anchor="middle">record, never rerun</text>
<path class="wire" d="M141.0,133.0 L155.0,133.0" marker-end="url(#ah)"/>
<rect class="box" x="156.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="218.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 2</text>
<text class="t" x="218.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Snapshot</text>
<text class="m" x="218.0" y="120.0" font-size="11.5" text-anchor="middle">exact source bytes</text>
<text class="m" x="218.0" y="136.0" font-size="11.5" text-anchor="middle">one SHA-256 each</text>
<text class="m" x="218.0" y="152.0" font-size="11.5" text-anchor="middle">owner-only files</text>
<path class="wire" d="M281.0,133.0 L295.0,133.0" marker-end="url(#ah)"/>
<rect class="box" x="296.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="358.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 3</text>
<text class="t" x="358.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Review</text>
<text class="m" x="358.0" y="120.0" font-size="11.5" text-anchor="middle">task, intent, rights</text>
<text class="m" x="358.0" y="136.0" font-size="11.5" text-anchor="middle">lineage, tests</text>
<text class="m" x="358.0" y="152.0" font-size="11.5" text-anchor="middle">executes nothing</text>
<path class="wire" d="M421.0,133.0 L435.0,133.0" marker-end="url(#ah)"/>
<rect class="hot" x="436.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="498.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 4</text>
<text class="t" x="498.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Verify</text>
<text class="m" x="498.0" y="120.0" font-size="11.5" text-anchor="middle">CPython twice,</text>
<text class="m" x="498.0" y="136.0" font-size="11.5" text-anchor="middle">then lypning-l</text>
<text class="m" x="498.0" y="152.0" font-size="11.5" text-anchor="middle">sealed bundle</text>
<path class="wire" d="M561.0,133.0 L575.0,133.0" marker-end="url(#ah)"/>
<rect class="hot" x="576.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="638.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 5</text>
<text class="t" x="638.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Train</text>
<text class="m" x="638.0" y="120.0" font-size="11.5" text-anchor="middle">SFT, LoRA r16</text>
<text class="m" x="638.0" y="136.0" font-size="11.5" text-anchor="middle">probe, then GRPO</text>
<text class="m" x="638.0" y="152.0" font-size="11.5" text-anchor="middle">only on signal</text>
<path class="wire" d="M701.0,133.0 L715.0,133.0" marker-end="url(#ah)"/>
<rect class="box" x="716.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="778.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 6</text>
<text class="t" x="778.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Evaluate</text>
<text class="m" x="778.0" y="120.0" font-size="11.5" text-anchor="middle">dev selects</text>
<text class="m" x="778.0" y="136.0" font-size="11.5" text-anchor="middle">test and eval-2</text>
<text class="m" x="778.0" y="152.0" font-size="11.5" text-anchor="middle">paired, locked</text>
<path class="wire" d="M841.0,133.0 L855.0,133.0" marker-end="url(#ah)"/>
<rect class="box" x="856.0" y="64.0" width="124.0" height="138.0" rx="8"/>
<text class="a" x="918.0" y="84.0" font-size="10.5" text-anchor="middle" font-weight="700">STEP 7</text>
<text class="t" x="918.0" y="101.0" font-size="13" text-anchor="middle" font-weight="700">Feed back</text>
<text class="m" x="918.0" y="120.0" font-size="11.5" text-anchor="middle">refusals, bugs</text>
<text class="m" x="918.0" y="136.0" font-size="11.5" text-anchor="middle">into engine work</text>
<text class="m" x="918.0" y="152.0" font-size="11.5" text-anchor="middle">and next bundle</text>
<path class="wire" d="M918.0,203.0 L918.0,262.0 L78.0,262.0 L78.0,205.0" marker-end="url(#ah)" stroke-dasharray="4 4"/>
<text class="m" x="490.0" y="256.0" font-size="12" text-anchor="middle">a new engine is a new arm: re-verify labels, build a new bundle,</text>
<text class="m" x="490.0" y="281.0" font-size="12" text-anchor="middle">never mutate a running experiment&#x27;s tests, populations or split</text>
<text class="f" x="16.0" y="318.0" font-size="10.5" text-anchor="start">Source: training/DATA_PRODUCTION.md, “One loop, distinct evidence and decisions”.</text>
</svg>
