<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d">
<title id="t">Training stages and the gate in front of each</title>
<desc id="d">Base control, then supervised fine-tuning with LoRA, then a train-only probe that admits GRPO, then post-hoc checkpoint selection on dev, then one locked evaluation.</desc>
<style>
  .bg   { fill: #fbfbfa; }
  .box  { fill: #f2f1ee; stroke: #d9d6cf; stroke-width: 1; }
  .hot  { fill: #f7ebe3; stroke: #9a4a20; stroke-width: 1.2; }
  .lane { fill: none; stroke: #e2e0da; stroke-width: 1; stroke-dasharray: 3 4; }
  .rule { stroke: #e2e0da; stroke-width: 1; }
  .axis { stroke: #b9b5ad; stroke-width: 1; }
  .ref  { stroke: #9a4a20; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .wire { stroke: #8d8981; stroke-width: 1.4; fill: none; }
  .head { fill: #8d8981; }
  .acc  { fill: #9a4a20; }
  .t    { fill: #1f1e1c; }
  .m    { fill: #6b6862; }
  .f    { fill: #8d8981; }
  .a    { fill: #9a4a20; }
  .s1   { fill: #2a78d6; }
  .s1l  { stroke: #2a78d6; stroke-width: 2; }
  .s2   { fill: #e34948; }
  .band1 { fill: #eef4fc; }
  .band2 { fill: #f7ebe3; }
  .band3 { fill: #edf6f1; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #16151a; }
    .box  { fill: #1e1d23; stroke: #3a3842; }
    .hot  { fill: #2b201b; stroke: #e0885a; }
    .lane { stroke: #2e2c34; }
    .rule { stroke: #2e2c34; }
    .axis { stroke: #5a5662; }
    .ref  { stroke: #e0885a; }
    .wire { stroke: #837e75; }
    .head { fill: #837e75; }
    .acc  { fill: #e0885a; }
    .t    { fill: #e8e6e1; }
    .m    { fill: #a9a49b; }
    .f    { fill: #837e75; }
    .a    { fill: #e0885a; }
    .s1   { fill: #3987e5; }
    .s1l  { stroke: #3987e5; }
    .s2   { fill: #e66767; }
    .band1 { fill: #1b2230; }
    .band2 { fill: #2b201b; }
    .band3 { fill: #19251f; }
  }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="300" rx="10"/>
<rect class="box" x="16.0" y="40.0" width="141.0" height="118.0" rx="8"/>
<text class="t" x="86.5" y="62.0" font-size="13" text-anchor="middle" font-weight="700">Base</text>
<text class="m" x="86.5" y="81.0" font-size="11.5" text-anchor="middle">Qwen3.8-27B, pinned</text>
<text class="m" x="86.5" y="97.0" font-size="11.5" text-anchor="middle">thinking off</text>
<text class="m" x="86.5" y="113.0" font-size="11.5" text-anchor="middle">the control arm</text>
<path class="wire" d="M158.0,99.0 L176.0,99.0" marker-end="url(#ah)"/>
<text class="a" x="86.5" y="188.0" font-size="10" text-anchor="middle" font-weight="700">GATE</text>
<text class="m" x="86.5" y="206.0" font-size="11.5" text-anchor="middle">same decoding</text>
<text class="m" x="86.5" y="222.0" font-size="11.5" text-anchor="middle">for every arm</text>
<rect class="hot" x="177.0" y="40.0" width="141.0" height="118.0" rx="8"/>
<text class="t" x="247.5" y="62.0" font-size="13" text-anchor="middle" font-weight="700">SFT</text>
<text class="m" x="247.5" y="81.0" font-size="11.5" text-anchor="middle">LoRA r16 α32, BF16</text>
<text class="m" x="247.5" y="97.0" font-size="11.5" text-anchor="middle">assistant tokens + EOS</text>
<text class="m" x="247.5" y="113.0" font-size="11.5" text-anchor="middle">family, then case</text>
<path class="wire" d="M319.0,99.0 L337.0,99.0" marker-end="url(#ah)"/>
<text class="a" x="247.5" y="188.0" font-size="10" text-anchor="middle" font-weight="700">GATE</text>
<text class="m" x="247.5" y="206.0" font-size="11.5" text-anchor="middle">≥1,000 cases</text>
<text class="m" x="247.5" y="222.0" font-size="11.5" text-anchor="middle">≥50k sup. tokens</text>
<rect class="box" x="338.0" y="40.0" width="141.0" height="118.0" rx="8"/>
<text class="t" x="408.5" y="62.0" font-size="13" text-anchor="middle" font-weight="700">Probe</text>
<text class="m" x="408.5" y="81.0" font-size="11.5" text-anchor="middle">every train case × 4</text>
<text class="m" x="408.5" y="97.0" font-size="11.5" text-anchor="middle">train split only</text>
<text class="m" x="408.5" y="113.0" font-size="11.5" text-anchor="middle">admits RL or not</text>
<path class="wire" d="M480.0,99.0 L498.0,99.0" marker-end="url(#ah)"/>
<text class="a" x="408.5" y="188.0" font-size="10" text-anchor="middle" font-weight="700">GATE</text>
<text class="m" x="408.5" y="206.0" font-size="11.5" text-anchor="middle">≥2 groups with</text>
<text class="m" x="408.5" y="222.0" font-size="11.5" text-anchor="middle">distinct rewards</text>
<rect class="hot" x="499.0" y="40.0" width="141.0" height="118.0" rx="8"/>
<text class="t" x="569.5" y="62.0" font-size="13" text-anchor="middle" font-weight="700">GRPO</text>
<text class="m" x="569.5" y="81.0" font-size="11.5" text-anchor="middle">Dr.GRPO, LR 5e-6</text>
<text class="m" x="569.5" y="97.0" font-size="11.5" text-anchor="middle">4 generations/prompt</text>
<text class="m" x="569.5" y="113.0" font-size="11.5" text-anchor="middle">β = 0, truncs masked</text>
<path class="wire" d="M641.0,99.0 L659.0,99.0" marker-end="url(#ah)"/>
<text class="a" x="569.5" y="188.0" font-size="10" text-anchor="middle" font-weight="700">GATE</text>
<text class="m" x="569.5" y="206.0" font-size="11.5" text-anchor="middle">every checkpoint</text>
<text class="m" x="569.5" y="222.0" font-size="11.5" text-anchor="middle">saved, step 0 too</text>
<rect class="box" x="660.0" y="40.0" width="141.0" height="118.0" rx="8"/>
<text class="t" x="730.5" y="62.0" font-size="13" text-anchor="middle" font-weight="700">Select</text>
<text class="m" x="730.5" y="81.0" font-size="11.5" text-anchor="middle">on dev, post hoc</text>
<text class="m" x="730.5" y="97.0" font-size="11.5" text-anchor="middle">correct-and-native</text>
<text class="m" x="730.5" y="113.0" font-size="11.5" text-anchor="middle">never stops a dose</text>
<path class="wire" d="M802.0,99.0 L820.0,99.0" marker-end="url(#ah)"/>
<text class="a" x="730.5" y="188.0" font-size="10" text-anchor="middle" font-weight="700">GATE</text>
<text class="m" x="730.5" y="206.0" font-size="11.5" text-anchor="middle">gate A: −2pp</text>
<text class="m" x="730.5" y="222.0" font-size="11.5" text-anchor="middle">and retention</text>
<rect class="box" x="821.0" y="40.0" width="141.0" height="118.0" rx="8"/>
<text class="t" x="891.5" y="62.0" font-size="13" text-anchor="middle" font-weight="700">Read</text>
<text class="m" x="891.5" y="81.0" font-size="11.5" text-anchor="middle">test and eval-2</text>
<text class="m" x="891.5" y="97.0" font-size="11.5" text-anchor="middle">paired with base</text>
<text class="m" x="891.5" y="113.0" font-size="11.5" text-anchor="middle">k = 16 on eval-2</text>
<text class="a" x="891.5" y="188.0" font-size="10" text-anchor="middle" font-weight="700">GATE</text>
<text class="m" x="891.5" y="206.0" font-size="11.5" text-anchor="middle">lower bound</text>
<text class="m" x="891.5" y="222.0" font-size="11.5" text-anchor="middle">above +3pp</text>
<line class="rule" x1="16.0" y1="248.0" x2="964.0" y2="248.0"/>
<text class="m" x="16.0" y="268.0" font-size="11.5" text-anchor="start">Decoding everywhere: temperature 0.7 · top-p 0.8 · top-k 20 · min-p 0 · presence penalty 0 · one beam · thinking disabled</text>
<text class="f" x="16.0" y="288.0" font-size="10.5" text-anchor="start">Source: training/TRAINING.md, training/STATUS.md §10 (floors enforced by train_verified.preflight and run()).</text>
</svg>
