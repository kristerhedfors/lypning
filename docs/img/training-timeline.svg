<circle class="head" cx="110" cy="130" r="4"/>
<text class="t" x="126.0" y="134.0" font-size="12.5" text-anchor="start">Eval-2 pre-registered before any draw; round-02 plumbing smoke on HF</text>
<text class="m mono" x="96.0" y="164.0" font-size="11.5" text-anchor="end">2026-09-16</text>
<circle class="head" cx="110" cy="160" r="4"/>
<text class="t" x="126.0" y="164.0" font-size="12.5" text-anchor="start">First 27B pilot: eval-2 base arm blocked at 384 / 1,200 draws</text>
<text class="m mono" x="96.0" y="194.0" font-size="11.5" text-anchor="end">2026-09-18</text>
<circle class="head" cx="110" cy="190" r="4"/>
<text class="t" x="126.0" y="194.0" font-size="12.5" text-anchor="start">Bank v2 admits 1,120 training cases on the split the gates use</text>
<text class="m mono" x="96.0" y="224.0" font-size="11.5" text-anchor="end">2026-09-19</text>
<circle class="head" cx="110" cy="220" r="4"/>
<text class="t" x="126.0" y="224.0" font-size="12.5" text-anchor="start">A missing User-Agent fixed: 7,967 generated candidates in one run</text>
<text class="m mono" x="96.0" y="254.0" font-size="11.5" text-anchor="end">2026-09-21</text>
<circle class="head" cx="110" cy="250" r="4"/>
<text class="t" x="126.0" y="254.0" font-size="12.5" text-anchor="start">Seed 1111 on bank v3: both stages select step 0, the selector is blind</text>
<text class="m mono" x="96.0" y="284.0" font-size="11.5" text-anchor="end">2026-09-22</text>
<circle class="head" cx="110" cy="280" r="4"/>
<text class="t" x="126.0" y="284.0" font-size="12.5" text-anchor="start">The instrument fixed: selection, macro scope, LoRA recipe (PRs #97–#101)</text>
<text class="m mono" x="96.0" y="314.0" font-size="11.5" text-anchor="end">2026-09-23</text>
<circle class="head" cx="110" cy="310" r="4"/>
<text class="t" x="126.0" y="314.0" font-size="12.5" text-anchor="start">Positive control flat: no distillation route; too few pairs for a preference arm</text>
<text class="m mono" x="96.0" y="344.0" font-size="11.5" text-anchor="end">2026-09-25</text>
<circle class="head" cx="110" cy="340" r="4"/>
<text class="t" x="126.0" y="344.0" font-size="12.5" text-anchor="start">Seed 1111 finish runs out of CUDA memory in the eval-2 prefill</text>
<text class="m mono" x="96.0" y="374.0" font-size="11.5" text-anchor="end">2026-09-26</text>
<circle class="acc" cx="110" cy="370" r="6"/>
<text class="t" x="126.0" y="374.0" font-size="12.5" text-anchor="start" font-weight="700">Seed 1111 finish completes: eval-2 +5.30pp; training paused for the engine</text>
<text class="f" x="16.0" y="412.0" font-size="10.5" text-anchor="start">Sources: training/STATUS.md §0 and §2, training/PLAN.md, training/START_NEXT_ROUND.md, CHANGELOG.md. Each number&#x27;s run id is in the prose.</text>
