<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="t d">
<title id="t">How one draw is graded</title>
<desc id="d">Correctness on CPython is checked first; only a correct draw is run on lypning-l. Native and identical scores 1; a valid refusal scores 0.25 on coverage and 1 on control; a disagreement scores 0 and is kept as an engine witness.</desc>
<style>
  .bg   { fill: #fbfbfa; }
  .box  { fill: #f2f1ee; stroke: #d9d6cf; stroke-width: 1; }
  .hot  { fill: #f7ebe3; stroke: #9a4a20; stroke-width: 1.2; }
  .lane { fill: none; stroke: #e2e0da; stroke-width: 1; stroke-dasharray: 3 4; }
  .rule { stroke: #e2e0da; stroke-width: 1; }
  .axis { stroke: #b9b5ad; stroke-width: 1; }
  .ref  { stroke: #9a4a20; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .wire { stroke: #8d8981; stroke-width: 1.4; fill: none; }
  .head { fill: #8d8981; }
  .acc  { fill: #9a4a20; }
  .t    { fill: #1f1e1c; }
  .m    { fill: #6b6862; }
  .f    { fill: #8d8981; }
  .a    { fill: #9a4a20; }
  .s1   { fill: #2a78d6; }
  .s1l  { stroke: #2a78d6; stroke-width: 2; }
  .s2   { fill: #e34948; }
  .band1 { fill: #eef4fc; }
  .band2 { fill: #f7ebe3; }
  .band3 { fill: #edf6f1; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #16151a; }
    .box  { fill: #1e1d23; stroke: #3a3842; }
    .hot  { fill: #2b201b; stroke: #e0885a; }
    .lane { stroke: #2e2c34; }
    .rule { stroke: #2e2c34; }
    .axis { stroke: #5a5662; }
    .ref  { stroke: #e0885a; }
    .wire { stroke: #837e75; }
    .head { fill: #837e75; }
    .acc  { fill: #e0885a; }
    .t    { fill: #e8e6e1; }
    .m    { fill: #a9a49b; }
    .f    { fill: #837e75; }
    .a    { fill: #e0885a; }
    .s1   { fill: #3987e5; }
    .s1l  { stroke: #3987e5; }
    .s2   { fill: #e66767; }
    .band1 { fill: #1b2230; }
    .band2 { fill: #2b201b; }
    .band3 { fill: #19251f; }
  }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="430" rx="10"/>
<rect class="box" x="16.0" y="150.0" width="180.0" height="92.0" rx="8"/>
<text class="t" x="106.0" y="172.0" font-size="13" text-anchor="middle" font-weight="700">one draw</text>
<text class="m" x="106.0" y="191.0" font-size="11.5" text-anchor="middle">the model&#x27;s program,</text>
<text class="m" x="106.0" y="207.0" font-size="11.5" text-anchor="middle">every test input</text>
<path class="wire" d="M197.0,196.0 L236.0,196.0" marker-end="url(#ah)"/>
<rect class="hot" x="238.0" y="138.0" width="216.0" height="116.0" rx="8"/>
<text class="t" x="346.0" y="160.0" font-size="13" text-anchor="middle" font-weight="700">1 · CPython first</text>
<text class="m" x="346.0" y="179.0" font-size="11.5" text-anchor="middle">right stdout on every input,</text>
<text class="m" x="346.0" y="195.0" font-size="11.5" text-anchor="middle">empty stderr, exit 0,</text>
<text class="m" x="346.0" y="211.0" font-size="11.5" text-anchor="middle">same verdict twice?</text>
<path class="wire" d="M346.0,137.0 L346.0,92.0" marker-end="url(#ah)"/>
<rect class="box" x="238.0" y="18.0" width="216.0" height="72.0" rx="8"/>
<text class="t" x="346.0" y="40.0" font-size="13" text-anchor="middle" font-weight="700">wrong → reward 0</text>
<text class="m" x="346.0" y="59.0" font-size="11" text-anchor="middle">incorrect, exception, timeout,</text>
<text class="m" x="346.0" y="75.0" font-size="11" text-anchor="middle">no code, missing EOS</text>
<path class="wire" d="M346.0,255.0 L346.0,306.0" marker-end="url(#ah)"/>
<rect class="box" x="238.0" y="308.0" width="216.0" height="72.0" rx="8"/>
<text class="t" x="346.0" y="330.0" font-size="13" text-anchor="middle" font-weight="700">unstable → abort</text>
<text class="m" x="346.0" y="349.0" font-size="11" text-anchor="middle">an unstable oracle or harness</text>
<text class="m" x="346.0" y="365.0" font-size="11" text-anchor="middle">failure stops the run</text>
<path class="wire" d="M455.0,196.0 L494.0,196.0" marker-end="url(#ah)"/>
<rect class="hot" x="496.0" y="138.0" width="196.0" height="116.0" rx="8"/>
<text class="t" x="594.0" y="160.0" font-size="13" text-anchor="middle" font-weight="700">2 · then lypning-l</text>
<text class="m" x="594.0" y="179.0" font-size="11.5" text-anchor="middle">the same inputs,</text>
<text class="m" x="594.0" y="195.0" font-size="11.5" text-anchor="middle">the engine the arm</text>
<text class="m" x="594.0" y="211.0" font-size="11.5" text-anchor="middle">is pinned to, by hash</text>
<path class="wire" d="M693.0,196.0 L730.0,54.0" marker-end="url(#ah)"/>
<rect class="box" x="732.0" y="18.0" width="232.0" height="72.0" rx="8"/>
<text class="t" x="848.0" y="40.0" font-size="13" text-anchor="middle" font-weight="700">native, identical</text>
<text class="m" x="848.0" y="59.0" font-size="11" text-anchor="middle">coverage 1  ·  control 1</text>
<path class="wire" d="M693.0,196.0 L730.0,198.0" marker-end="url(#ah)"/>
<rect class="box" x="732.0" y="162.0" width="232.0" height="72.0" rx="8"/>
<text class="t" x="848.0" y="184.0" font-size="13" text-anchor="middle" font-weight="700">valid refusal (exit 90)</text>
<text class="m" x="848.0" y="203.0" font-size="11" text-anchor="middle">coverage 0.25  ·  control 1</text>
<path class="wire" d="M693.0,196.0 L730.0,342.0" marker-end="url(#ah)"/>
<rect class="box" x="732.0" y="306.0" width="232.0" height="88.0" rx="8"/>
<text class="t" x="848.0" y="328.0" font-size="13" text-anchor="middle" font-weight="700">runs, disagrees</text>
<text class="m" x="848.0" y="347.0" font-size="11" text-anchor="middle">0, kept as an engine witness;</text>
<text class="m" x="848.0" y="363.0" font-size="11" text-anchor="middle">abort past 1% of a run&#x27;s draws</text>
<text class="f" x="16.0" y="418.0" font-size="10.5" text-anchor="start">Source: training/TRAINING.md “Verification and learning”. No legality-only bonus, syntax credit, import penalty or length reward.</text>
</svg>
