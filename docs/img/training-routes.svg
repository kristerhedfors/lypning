<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
<title id="t">Three routes into a training bank</title>
<desc id="d">Authored, generate-and-adapt and capture-tier cases become schema-3 cases, are verified by training-prepare, and are split by connected component into train, dev and test, beside a separate eval-2 benchmark bank.</desc>
<style>
  .bg   { fill: #fbfbfa; }
  .box  { fill: #f2f1ee; stroke: #d9d6cf; stroke-width: 1; }
  .hot  { fill: #f7ebe3; stroke: #9a4a20; stroke-width: 1.2; }
  .lane { fill: none; stroke: #e2e0da; stroke-width: 1; stroke-dasharray: 3 4; }
  .rule { stroke: #e2e0da; stroke-width: 1; }
  .axis { stroke: #b9b5ad; stroke-width: 1; }
  .ref  { stroke: #9a4a20; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .wire { stroke: #8d8981; stroke-width: 1.4; fill: none; }
  .head { fill: #8d8981; }
  .acc  { fill: #9a4a20; }
  .t    { fill: #1f1e1c; }
  .m    { fill: #6b6862; }
  .f    { fill: #8d8981; }
  .a    { fill: #9a4a20; }
  .s1   { fill: #2a78d6; }
  .s1l  { stroke: #2a78d6; stroke-width: 2; }
  .s2   { fill: #e34948; }
  .band1 { fill: #eef4fc; }
  .band2 { fill: #f7ebe3; }
  .band3 { fill: #edf6f1; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #16151a; }
    .box  { fill: #1e1d23; stroke: #3a3842; }
    .hot  { fill: #2b201b; stroke: #e0885a; }
    .lane { stroke: #2e2c34; }
    .rule { stroke: #2e2c34; }
    .axis { stroke: #5a5662; }
    .ref  { stroke: #e0885a; }
    .wire { stroke: #837e75; }
    .head { fill: #837e75; }
    .acc  { fill: #e0885a; }
    .t    { fill: #e8e6e1; }
    .m    { fill: #a9a49b; }
    .f    { fill: #837e75; }
    .a    { fill: #e0885a; }
    .s1   { fill: #3987e5; }
    .s1l  { stroke: #3987e5; }
    .s2   { fill: #e66767; }
    .band1 { fill: #1b2230; }
    .band2 { fill: #2b201b; }
    .band3 { fill: #19251f; }
  }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="470" rx="10"/>
<rect class="box" x="16.0" y="30.0" width="262.0" height="112.0" rx="8"/>
<text class="t" x="147.0" y="52.0" font-size="13" text-anchor="middle" font-weight="700">Authored bank (v2)</text>
<text class="m" x="147.0" y="71.0" font-size="11.5" text-anchor="middle">two independent implementations</text>
<text class="m" x="147.0" y="87.0" font-size="11.5" text-anchor="middle">must agree under execution</text>
<text class="m" x="147.0" y="103.0" font-size="11.5" text-anchor="middle">evidence: differential oracle</text>
<path class="wire" d="M279.0,86.0 L318.0,220.0" marker-end="url(#ah)"/>
<rect class="box" x="16.0" y="170.0" width="262.0" height="112.0" rx="8"/>
<text class="t" x="147.0" y="192.0" font-size="13" text-anchor="middle" font-weight="700">Generate-and-adapt (v3)</text>
<text class="m" x="147.0" y="211.0" font-size="11.5" text-anchor="middle">the model proposes and answers k×,</text>
<text class="m" x="147.0" y="227.0" font-size="11.5" text-anchor="middle">rules repair what L refuses</text>
<text class="m" x="147.0" y="243.0" font-size="11.5" text-anchor="middle">evidence: self-consistency</text>
<path class="wire" d="M279.0,226.0 L318.0,220.0" marker-end="url(#ah)"/>
<rect class="box" x="16.0" y="310.0" width="262.0" height="112.0" rx="8"/>
<text class="t" x="147.0" y="332.0" font-size="13" text-anchor="middle" font-weight="700">Capture tier</text>
<text class="m" x="147.0" y="351.0" font-size="11.5" text-anchor="middle">programs agents really ran,</text>
<text class="m" x="147.0" y="367.0" font-size="11.5" text-anchor="middle">static quality gate, tier A only</text>
<text class="m" x="147.0" y="383.0" font-size="11.5" text-anchor="middle">its own bank, never merged</text>
<path class="wire" d="M279.0,366.0 L318.0,220.0" marker-end="url(#ah)"/>
<rect class="box" x="320.0" y="128.0" width="196.0" height="184.0" rx="8"/>
<text class="t" x="418.0" y="150.0" font-size="13" text-anchor="middle" font-weight="700">schema-3 case</text>
<text class="m" x="418.0" y="169.0" font-size="11.5" text-anchor="middle">task  ·  reference</text>
<text class="m" x="418.0" y="185.0" font-size="11.5" text-anchor="middle">≥3 inputs, ≥2 outputs</text>
<text class="m" x="418.0" y="201.0" font-size="11.5" text-anchor="middle">population: coverage</text>
<text class="m" x="418.0" y="217.0" font-size="11.5" text-anchor="middle">or fallback-control</text>
<text class="m" x="418.0" y="233.0" font-size="11.5" text-anchor="middle">source group  ·  capabilities</text>
<text class="m" x="418.0" y="249.0" font-size="11.5" text-anchor="middle">review record</text>
<path class="wire" d="M517.0,220.0 L556.0,220.0" marker-end="url(#ah)"/>
<rect class="hot" x="558.0" y="128.0" width="200.0" height="184.0" rx="8"/>
<text class="t" x="658.0" y="150.0" font-size="13" text-anchor="middle" font-weight="700">training-prepare</text>
<text class="m" x="658.0" y="169.0" font-size="11.5" text-anchor="middle">CPython, run twice</text>
<text class="m" x="658.0" y="185.0" font-size="11.5" text-anchor="middle">then the pinned lypning-l</text>
<text class="m" x="658.0" y="201.0" font-size="11.5" text-anchor="middle">coverage: native on all</text>
<text class="m" x="658.0" y="217.0" font-size="11.5" text-anchor="middle">control: refused on all</text>
<text class="m" x="658.0" y="233.0" font-size="11.5" text-anchor="middle">a mismatch blocks</text>
<text class="m" x="658.0" y="249.0" font-size="11.5" text-anchor="middle">→ sealed, hashed bundle</text>
<path class="wire" d="M759.0,220.0 L796.0,220.0" marker-end="url(#ah)"/>
<text class="f" x="880.0" y="58.0" font-size="10.5" text-anchor="middle" font-weight="700">split by connected</text>
<text class="f" x="880.0" y="72.0" font-size="10.5" text-anchor="middle" font-weight="700">component, per population</text>
<rect class="box" x="798.0" y="86.0" width="166.0" height="60.0" rx="8"/>
<text class="t" x="881.0" y="108.0" font-size="13" text-anchor="middle" font-weight="700">train</text>
<text class="m" x="881.0" y="127.0" font-size="11" text-anchor="middle">SFT targets, RL prompts</text>
<rect class="box" x="798.0" y="158.0" width="166.0" height="60.0" rx="8"/>
<text class="t" x="881.0" y="180.0" font-size="13" text-anchor="middle" font-weight="700">dev</text>
<text class="m" x="881.0" y="199.0" font-size="11" text-anchor="middle">checkpoint selection</text>
<rect class="box" x="798.0" y="230.0" width="166.0" height="60.0" rx="8"/>
<text class="t" x="881.0" y="252.0" font-size="13" text-anchor="middle" font-weight="700">test</text>
<text class="m" x="881.0" y="271.0" font-size="11" text-anchor="middle">one locked read</text>
<rect class="lane" x="790" y="40" width="182" height="272" rx="10"/>
<rect class="box" x="558.0" y="352.0" width="406.0" height="92.0" rx="8"/>
<text class="t" x="761.0" y="374.0" font-size="13" text-anchor="middle" font-weight="700">eval-2 benchmark bank</text>
<text class="m" x="761.0" y="393.0" font-size="11.5" text-anchor="middle">capability-disjoint from training, pre-registered before a draw,</text>
<text class="m" x="761.0" y="409.0" font-size="11.5" text-anchor="middle">scored at k = 16 against base on the same prompts</text>
<text class="f" x="16.0" y="458.0" font-size="10.5" text-anchor="start">Sources: training/README.md “Bank v3”, training/DATA_PRODUCTION.md “Capture tier”, training/TRAINING.md “Data admission”, training/EVAL2.md.</text>
</svg>
