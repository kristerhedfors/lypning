[package]
name = "lypning"
version = "0.1.0"
edition = "2021"
description = "The Coding Harness Interpreter Optimizer — a from-scratch Rust runtime (the Rust spectrum of a mixture of Pythons, one variant per feature) for agent-typed Python one-liners"
license = "MIT"
# The floor is the committed Cargo.lock, which the wheel ships and `lypning
# build` hands to cargo: it is lockfile format 4, which cargo before 1.78
# refuses to read. The source itself needs only `Option::is_some_and` (1.70),
# measured by grep rather than by a compile under 1.70, but a floor a user
# cannot actually build at is a claim, not a floor.
rust-version = "1.78"

# ZERO runtime dependencies, on purpose. CLAUDE.md invariant 6 governs src/;
# the same discipline applies here for a second reason: every crate linked in
# is bytes in a binary whose cold cost in the CheerpX VM tracks bytes and file
# opens (docs/SANDBOX-PERFORMANCE.md §1). std only.
[dependencies]

[[bin]]
name = "lypning"
path = "src/main.rs"

# The same code, twice over: an `rlib` for the binary above and, when the
# `capi` feature is on, a `cdylib`/`staticlib` for hosts that embed the runtime
# instead of spawning it. One crate rather than two so there is one parser, one
# evaluator and one commit barrier — a second implementation of the refusal
# contract is exactly how a MISMATCH reaches a release.
[lib]
name = "lypning"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Exactly one `variant-*` feature is on in any build: it names the point on the
# Rust spectrum this binary is (`build.rs` turns it into `LYPNING_ENGINE`, the
# name at the head of every refusal line, and refuses zero or two). `variant-m`
# is today's binary and the default, so `cargo build` by hand and `lypning
# build --rust` still produce the same artefact from the same object cache.
# Capability features (`cap-*`) gate code and are never passed by hand — a
# variant feature names its set. `route::CAPS` says what each one serves and
# `build.rs` turns the set that is on into `LYPNING_CAPS`, which the binary
# states back through `route --spectrum`.
#
# The C ABI is compiled only for the library build, which is also the only
# build allowed to unwind — see `capi.rs` for why that is enforced rather than
# documented.
default = ["variant-m"]
variant-m = []
# The 4 MB point. Names the smaller variant so cargo's feature union makes it a
# superset by construction — the monotonicity the router assumes. It grows one
# `cap-*` per step; `variant-m` is FROZEN and gains none of them.
variant-l = ["variant-m", "cap-bigint", "cap-collections", "cap-csv", "cap-glob", "cap-pathlib", "cap-re"]

# `collections.Counter` and `collections.defaultdict` — 83 of the corpus
# programs measured on 2026-09-04 import `collections`, and between them they
# use only those two names. `src/collections.rs` is the whole of it.
# Python's integers, which are arbitrary precision, where `variant-m` has i64
# and a refusal. NOT a module: it widens `Value::Int`'s payload, so the compiler
# — not a reviewer — enumerates the paths that held an integer. `src/bigint.rs`
# is the whole of it, and the two runtime kinds it answers are the only rows in
# `route::CAPS` that are refusals rather than modules.
cap-bigint = []

cap-collections = []

# `pathlib.Path` — the top row of the measured build order: it is the module the
# corpus reaches for most among those lypning does not serve, and the densest
# one on that list, because the pure-path surface is string algebra over one
# `Rc<str>` and the filesystem surface is the commit barrier `io.rs` already
# holds. `src/pathlib.rs` is the whole of it.
cap-pathlib = []

# `re` — the module, its flag constants, `re.escape` and `re.purge`, and the
# NAMES of the matcher-backed functions, which refuse at call time until the
# matcher lands. 248 corpus programs (2026-09-04) were blocked on `import re`
# and 174 of them never reach a regex call in the battery. `src/re.rs` is the
# whole of it; the core gains none of it.
cap-re = []

# `csv.reader` and `csv.DictReader`, EAGER, as a plain iterator over lists — no
# new `Value` variant, which is the one thing the first attempt at this
# capability got wrong (`docs/HILLCLIMB.md` iteration 74). `csv.writer` and
# `csv.DictWriter` are absent, so the router's walk stops on `module-attr:
# csv.writer` and CPython answers them. 23 corpus programs (2026-09-06) were
# blocked on `import csv`: 15 read a file, 2 read `sys.stdin`, 6 write.
# `src/csv.rs` is the whole of it.
cap-csv = []

# `glob` — `glob.glob`, `glob.iglob`, `glob.escape` and `glob.has_magic`. The
# match SET is computed exactly and the match ORDER is never observable,
# because `route.rs` admits the call only where a walk can see that the order
# cannot be seen (`sorted(...)`, `len(...)`, `in`, …) and blocks `glob-order`
# statically everywhere else. 69 corpus programs (mined 2026-09-06) import it
# and every one of them calls `glob.glob`. `src/glob.rs` is the whole of it.
cap-glob = []

capi = []

# The library's profile, and the one thing it may not inherit is `panic`.
#
# `abort` is right for the binary: there is nothing to save, and the unwinding
# tables are bytes in an image whose cold cost is measured in device blocks. It
# is wrong for a library, where an abort takes down an application that merely
# asked to run a one-liner. So the C ABI catches every unwind at its boundary,
# and this profile is what gives it something to catch.
[profile.release-lib]
inherits = "release"
panic = "unwind"

[profile.release]
opt-level = "s"   # size, not speed: most of an invocation is the OS spawning
                  # the process (docs/SANDBOX-PERFORMANCE.md §3), so codegen
                  # quality cannot buy what a smaller image can.
lto = true
codegen-units = 1
panic = "abort"
strip = true
