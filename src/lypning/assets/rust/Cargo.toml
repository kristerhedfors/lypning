[package]
name = "lypning"
version = "0.1.0"
edition = "2021"
description = "The Coding Harness Interpreter Optimizer — a from-scratch Rust runtime (the bottom tier of a mixture of Pythons) for agent-typed Python one-liners"
license = "MIT"
# The floor is the committed Cargo.lock, which the wheel ships and `lypning
# build` hands to cargo: it is lockfile format 4, which cargo before 1.78
# refuses to read. The source itself needs only `Option::is_some_and` (1.70),
# measured by grep rather than by a compile under 1.70, but a floor a user
# cannot actually build at is a claim, not a floor.
rust-version = "1.78"

# ZERO runtime dependencies, on purpose. CLAUDE.md invariant 5 governs src/;
# the same discipline applies here for a second reason: every crate linked in
# is bytes in a binary whose cold cost in the CheerpX VM tracks bytes and file
# opens (the lypning-mp skill §1). std only.
[dependencies]

[[bin]]
name = "lypning"
path = "src/main.rs"

# The same code, twice over: an `rlib` for the binary above and, when the
# `capi` feature is on, a `cdylib`/`staticlib` for hosts that embed the runtime
# instead of spawning it. One crate rather than two so there is one parser, one
# evaluator and one commit barrier — a second implementation of the refusal
# contract is exactly how a MISMATCH reaches a release.
[lib]
name = "lypning"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Exactly one `variant-*` feature is on in any build: it names the point on the
# Rust spectrum this binary is (`build.rs` turns it into `LYPNING_ENGINE`, the
# name at the head of every refusal line, and refuses zero or two). `variant-m`
# is today's binary and the default, so `cargo build` by hand and `lypning
# build --rust` still produce the same artefact from the same object cache.
# Capability features (`cap-*`) gate code and are never passed by hand — a
# variant feature names its set; none exist yet.
#
# The C ABI is compiled only for the library build, which is also the only
# build allowed to unwind — see `capi.rs` for why that is enforced rather than
# documented.
default = ["variant-m"]
variant-m = []
# The 4 MB point. Names the smaller variant so cargo's feature union makes it a
# superset by construction — the monotonicity the router assumes. Identical
# capabilities today; it grows one `cap-*` per step.
variant-l = ["variant-m"]
capi = []

# The library's profile, and the one thing it may not inherit is `panic`.
#
# `abort` is right for the binary: there is nothing to save, and the unwinding
# tables are bytes in an image whose cold cost is measured in device blocks. It
# is wrong for a library, where an abort takes down an application that merely
# asked to run a one-liner. So the C ABI catches every unwind at its boundary,
# and this profile is what gives it something to catch.
[profile.release-lib]
inherits = "release"
panic = "unwind"

[profile.release]
opt-level = "s"   # size, not speed: 96% of an invocation is the OS spawning
                  # the process (docs/MICROPYTHON.md §8c), so codegen quality cannot
                  # buy what a smaller image can.
lto = true
codegen-units = 1
panic = "abort"
strip = true
