[package]
name = "lypning"
version = "0.1.0"
edition = "2021"
description = "The Coding Harness Interpreter Optimizer — a from-scratch Rust runtime (the Rust spectrum of a mixture of Pythons, one variant per feature) for agent-typed Python one-liners"
license = "MIT"
# The floor is the committed Cargo.lock, which the wheel ships and `lypning
# build` hands to cargo: it is lockfile format 4, which cargo before 1.78
# refuses to read. The source itself needs only `Option::is_some_and` (1.70),
# measured by grep rather than by a compile under 1.70, but a floor a user
# cannot actually build at is a claim, not a floor.
rust-version = "1.78"

# ZERO runtime dependencies, on purpose. CLAUDE.md invariant 6 governs src/;
# the same discipline applies here for a second reason: every crate linked in
# is bytes in a binary whose cold cost in the CheerpX VM tracks bytes and file
# opens (docs/SANDBOX-PERFORMANCE.md §1). std only.
[dependencies]

[[bin]]
name = "lypning"
path = "src/main.rs"

# The same code, twice over: an `rlib` for the binary above and, when the
# `capi` feature is on, a `cdylib`/`staticlib` for hosts that embed the runtime
# instead of spawning it. One crate rather than two so there is one parser, one
# evaluator and one commit barrier — a second implementation of the refusal
# contract is exactly how a MISMATCH reaches a release.
[lib]
name = "lypning"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Exactly one `variant-*` feature is on in any build: it names the point on the
# Rust spectrum this binary is (`build.rs` turns it into `LYPNING_ENGINE`, the
# name at the head of every refusal line, and refuses zero or two). `variant-m`
# is today's binary and the default, so `cargo build` by hand and `lypning
# build --rust` still produce the same artefact from the same object cache.
# Capability features (`cap-*`) gate code and are never passed by hand — a
# variant feature names its set. `route::CAPS` says what each one serves and
# `build.rs` turns the set that is on into `LYPNING_CAPS`, which the binary
# states back through `route --spectrum`.
#
# The C ABI is compiled only for the library build, which is also the only
# build allowed to unwind — see `capi.rs` for why that is enforced rather than
# documented.
default = ["variant-m"]
variant-m = []
# The 4 MB point. Names the smaller variant so cargo's feature union makes it a
# superset by construction — the monotonicity the router assumes. It grows one
# `cap-*` per step; `variant-m` is FROZEN and gains none of them.
variant-l = ["variant-m", "cap-ast", "cap-base64", "cap-bigint", "cap-binascii", "cap-collections", "cap-csv", "cap-difflib", "cap-future", "cap-glob", "cap-hashlib", "cap-itertools", "cap-pathlib", "cap-random", "cap-re", "cap-statistics", "cap-textwrap", "cap-time"]

# `collections.Counter` and `collections.defaultdict` — 83 of the corpus
# programs measured on 2026-09-04 import `collections`, and between them they
# use only those two names. `src/collections.rs` is the whole of it.
# Python's integers, which are arbitrary precision, where `variant-m` has i64
# and a refusal. NOT a module: it widens `Value::Int`'s payload, so the compiler
# — not a reviewer — enumerates the paths that held an integer. `src/bigint.rs`
# is the whole of it, and the two runtime kinds it answers are the only rows in
# `route::CAPS` that are refusals rather than modules.
cap-bigint = []

cap-collections = []

# `pathlib.Path` — the top row of the measured build order: it is the module the
# corpus reaches for most among those lypning does not serve, and the densest
# one on that list, because the pure-path surface is string algebra over one
# `Rc<str>` and the filesystem surface is the commit barrier `io.rs` already
# holds. `src/pathlib.rs` is the whole of it.
cap-pathlib = []

# `re` — the module, its flag constants, `re.escape` and `re.purge`, and the
# NAMES of the matcher-backed functions, which refuse at call time until the
# matcher lands. 248 corpus programs (2026-09-04) were blocked on `import re`
# and 174 of them never reach a regex call in the battery. `src/re.rs` is the
# whole of it; the core gains none of it.
cap-re = []

# `csv.reader` and `csv.DictReader`, LAZY, over files, stdin and in-memory
# list/tuple/string line sources — no
# new `Value` variant, which is the one thing the first attempt at this
# capability got wrong (`docs/HILLCLIMB.md` iteration 74). `csv.writer` and
# `csv.DictWriter` are absent, so the router's walk stops on `module-attr:
# csv.writer` and CPython answers them. 23 corpus programs (2026-09-06) were
# blocked on `import csv`: 15 read a file, 2 read `sys.stdin`, 6 write.
# `src/csv.rs` is the whole of it.
cap-csv = []

# `glob` — `glob.glob`, `glob.iglob`, `glob.escape` and `glob.has_magic`.
# `glob.glob` answers in CPython's own yield order over `readdir`, in any
# position; the lazy `iglob` only where `route.rs` sees its order cannot show
# (`sorted(...)`, `in`, …). A visible order over a directory the run has
# changed refuses `glob-order` at runtime. `src/glob.rs` is the whole of it.
cap-glob = []

# `base64.b64encode` / `b64decode` / `urlsafe_b64encode` / `urlsafe_b64decode`,
# over `bytes` in and `bytes` out — no new `Value` variant, which is the defect
# five capabilities in a row shipped (`docs/HILLCLIMB.md` iterations 74, 76, 77).
# The rest of the module — `b16*`, `b32*`, `b85*`, `a85*`, `encodebytes`,
# `standard_b64*` — is absent, so the router's walk stops on `module-attr:
# base64.<name>` out of `route::MODULE_ATTRS` and CPython answers it. Every
# refusal a served call can raise that the SOURCE spells is decided in the WALK,
# before the program starts. 12 corpus entries (2026-09-06, 3,688 loaded) were
# blocked on `import base64`. `src/base64.rs` is the whole of it.
cap-base64 = []

# `binascii.hexlify` / `b2a_hex` / `unhexlify` / `a2b_hex` / `a2b_base64` /
# `b2a_base64`, bytes in and bytes out. The base64 pair CALLS `base64.rs`'s
# decoder and encoder rather than copying them — hence the dependency — so
# the 3.11/3.12 versus 3.13+ decode split is refused in one place. `Error`,
# `crc32` and the uu/qp codecs are absent, so `route::MODULE_ATTRS` blocks
# them in the CORE's walk; every `binascii.Error` an input would raise is a
# refusal. 13 corpus programs (mined 2026-09-24) were blocked first on
# `import binascii`. `src/binascii.rs` is the whole of it — and, for binary
# records, `struct.pack` / `unpack` / `unpack_from` / `calcsize` over the
# codes `x c b B ? h H i I l L q Q s d`, every `struct.error` a refusal:
# `src/pystruct.rs`.
cap-binascii = ["cap-base64"]

# `hashlib.md5` / `sha1` / `sha256` / `sha512`, with `.update()`,
# `.hexdigest()`, `.digest()`, `.name` and `.digest_size`. No new `Value`
# variant: a hash object is `Value::IterObj` over a new `Iter::Hash`, the shape
# `csv.reader` already returns. `hashlib.new`, `algorithms_guaranteed`, the
# variable-length digests (`blake2*`, `shake_*`) and `pbkdf2_hmac` are absent,
# so `route::MODULE_ATTRS` blocks them in the CORE's walk. 14 corpus programs
# (mined 2026-09-06) are blocked first on `import hashlib`; 10 of them need
# nothing else this variant lacks. `src/hashlib.rs` is the whole of it.
cap-hashlib = []

# `statistics.mean` / `median` / `median_low` / `median_high`. The medians are
# the engine's own `sorted` plus its own `+` and `/`, so types, NaN refusal and
# error texts are inherited; `mean` is an exact integer sum over ints and bools
# and refuses a float, whose CPython answer is an exactly rounded rational. The
# rest of the module is absent, so `route::MODULE_ATTRS` blocks it in the CORE's
# walk. 34 corpus programs (census 2026-09-24) are blocked first on `import
# statistics`. `src/statistics.rs` is the whole of it.
cap-statistics = []

# `itertools.product` and `itertools.combinations`, their inputs drained at
# construction and their results produced lazily by an index counter — an
# `Iter` arm inside `Value::IterObj`, never a new `Value` variant. Every other
# name on the module is absent, so `route::MODULE_ATTRS` blocks it in the
# CORE's walk. 37 corpus programs (census 2026-09-24) were blocked first on
# `import itertools`. `src/itertools.rs` is the whole of it.
cap-itertools = []

# `import difflib` and NOTHING on it: `route::MODULE_ATTRS` carries an EMPTY
# row, so every `difflib.<name>` is a static `module-attr` block in the core's
# walk and only a program that imports the module without touching it is
# admitted. No source file; `modules::MODULES` is the whole of it.
cap-difflib = []

# `textwrap.dedent`, `indent` (default predicate), `wrap`, `fill` and
# `shorten`, ported statement for statement from CPython 3.14's
# `Lib/textwrap.py`, with the `break_on_hyphens` regex as a hand-written
# scanner. `TextWrapper` and every keyword outside `width`, `initial_indent`,
# `subsequent_indent`, `break_long_words`, `break_on_hyphens` (and `shorten`'s
# `placeholder`) are refused in the WALK. 44 corpus programs (census
# 2026-09-24) were blocked first on `import textwrap`. `src/textwrap.rs` is the
# whole of it.
cap-textwrap = []

# `import ast` and `ast.literal_eval(s)` over a `str`, by a token-level
# recursive descent of its own (`parse.rs` folds `-<literal>`), behind a screen
# that refuses every text `lex.rs` and CPython's tokenizer could read
# differently. Every other name on the module — `ast.parse` above all, since
# `parse.rs` accepts programs CPython's `ast.parse` rejects — is a
# `module-attr` block in the CORE's walk. `src/pyast.rs` is the whole of it.
cap-ast = []

# `time.time` / `time_ns` / `monotonic` / `monotonic_ns` / `perf_counter` /
# `perf_counter_ns` through `clock_gettime(2)` declared `extern "C"` (no crate),
# `time.sleep` bounded by the walk to a literal of at most one second outside
# any loop or function (a refusal re-runs the program on CPython, so a served
# sleep may be paid twice), and the one fused `strftime(<literal>, gmtime())`
# UTC stamp over `%Y %m %d %H %M %S %%`. Everything local-time is absent and
# refused statically. 58 corpus programs (census 2026-09-24, 9,064 loaded) are
# blocked first on `import time`. `src/time.rs` is the whole of it.
cap-time = []

# `from __future__ import …` — a pass over the parse, not a module: the head of
# future imports is stripped when every name is one Python 3 makes mandatory
# (and so a no-op) or `annotations`, whose effect — no annotation is ever
# evaluated — the pass implements by clearing them. Every misuse CPython
# answers with a `SyntaxError` refuses statically, as does the `_Feature` name
# and `__annotations__`. 76 corpus programs (census 2026-09-24, 9,064 loaded)
# stopped first on this import. `src/future.rs` is the whole of it, plus one
# `#[cfg]` line at the end of `parse::parse()`. It also serves the two
# PARSE-time kinds the core refuses under the same contract — held from the
# first statement: decorators on a `def` and keyword-only parameters
# (`parse.rs`, the binder in `eval.rs`), which its `route::CAPS` row lists.
cap-future = []

# `random.Random(int)` instances, `random.sample`, `random.shuffle`, and
# `sys.version_info` as `[0]`, `[:2]`, `.major`/`.minor` or compared with a
# tuple of at most two items. It serves no MODULE — `random` and `sys` are the
# core's — so its routing half is `route::CAP_ATTRS`, carried by every variant,
# and the instance is `Value::IterObj` over `Iter::Rng`, never a new `Value`
# variant. `src/randobj.rs` is the whole of it.
cap-random = []

capi = []

# The library's profile, and the one thing it may not inherit is `panic`.
#
# `abort` is right for the binary: there is nothing to save, and the unwinding
# tables are bytes in an image whose cold cost is measured in device blocks. It
# is wrong for a library, where an abort takes down an application that merely
# asked to run a one-liner. So the C ABI catches every unwind at its boundary,
# and this profile is what gives it something to catch.
[profile.release-lib]
inherits = "release"
panic = "unwind"

[profile.release]
opt-level = "s"   # size, not speed: most of an invocation is the OS spawning
                  # the process (docs/SANDBOX-PERFORMANCE.md §3), so codegen
                  # quality cannot buy what a smaller image can.
lto = true
codegen-units = 1
panic = "abort"
strip = true
